name: Build OpenWrt with SSR-Plus and Trafficctl

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  TARGET: x86_64
  FEED_CONF: feeds.conf.default

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 先 checkout openwrt-build 仓库（含自定义 package/）
      - name: Checkout openwrt-build (custom packages)
        uses: actions/checkout@v4
        with:
          path: openwrt-build

      # ------------------------------------------------------------------
      # 版本号提取（唯一来源：CHANGELOG.md 顶部的 `## [vX.Y.Z] - YYYY-MM-DD`）。
      # 与 release.yml 的版本来源保持一致，避免两处版本号漂移。
      # 产物命名与 artifact 名均带该版本号，便于区分每次构建。
      # 输出的 VERSION（含 v 前缀）/ VERSION_NOV（不含 v）/ SHORT_SHA
      # 写入 $GITHUB_ENV，供后续所有步骤使用。
      # 必须放在 checkout 之后 —— 需要读取 openwrt-build/CHANGELOG.md。
      # ------------------------------------------------------------------
      - name: Resolve version from CHANGELOG
        working-directory: openwrt-build
        run: |
          # 取 CHANGELOG 中第一个版本标题行
          VER_LINE="$(grep -m1 '^## \[v' CHANGELOG.md || true)"
          if [ -z "$VER_LINE" ]; then
            echo "!!! CHANGELOG.md 顶部找不到 '## [vX.Y.Z]' 版本标题，构建中止" >&2
            echo "    （产物需要版本号，无版本号不允许出包）" >&2
            exit 1
          fi
          # 从 `## [v0.4.3] - 2026-10-09` 中提取 v0.4.3
          VERSION="$(printf '%s\n' "$VER_LINE" | sed -n 's/^## \[\(v[^]]*\)\].*/\1/p')"
          if [ -z "$VERSION" ]; then
            echo "!!! 无法从版本标题解析版本号: [$VER_LINE]" >&2
            exit 1
          fi
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;   # 形如 v1.2.3，接受
            *)
              echo "!!! 版本号格式异常（应为 vMAJOR.MINOR.PATCH）: [$VERSION]" >&2
              exit 1
              ;;
          esac
          VERSION_NOV="${VERSION#v}"
          # 构建号：短 SHA，便于同一版本多次构建时区分
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          echo "CHANGELOG 顶部版本: $VERSION (构建号 $SHORT_SHA)"
          {
            echo "VERSION=$VERSION"
            echo "VERSION_NOV=$VERSION_NOV"
            echo "SHORT_SHA=$SHORT_SHA"
          } >> "$GITHUB_ENV"

      - name: Checkout lede source
        uses: actions/checkout@v4
        with:
          repository: coolsnowwolf/lede
          ref: master
          path: lede

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils-extra rsync unzip zlib1g-dev \
            file wget subversion upx-ucl autoconf automake curl asciidoc libtool

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Set JOBS
        # GHA runner 只有 7GB 内存，Go 编译 Xray 吃内存，限制并行度防 OOM
        run: echo "JOBS=2" >> $GITHUB_ENV

      - name: Add helloworld feed (dedup-safe)
        working-directory: lede
        run: |
          # 注意: lede feeds.conf.default 自 2026 年起已自带 helloworld feed,
          # 旧写法直接追加会导致 "Duplicate feed name 'helloworld'" → feeds update
          # 失败 (exit 25) → 整个构建中止。这里先判重、仅当缺失时才追加, 幂等。
          grep -q '^src-git helloworld' "$FEED_CONF" 2>/dev/null || \
            echo "src-git helloworld https://github.com/fw876/helloworld" >> "$FEED_CONF"
          echo "--- feeds.conf helloworld 条目 ---"
          grep '^src-git helloworld' "$FEED_CONF"

      - name: Add luci-app-trafficctl (本地包，含中文翻译)
        working-directory: lede
        run: |
          cp -r ../openwrt-build/package/luci-app-trafficctl package/

      - name: Fetch luci-app-dnsproxy upstream and apply local patches (ALL_DOH)
        working-directory: lede
        run: |
          # ============================================================
          # ALL_DOH: 以 patch 形式在 openwrt-build 维护 luci-app-dnsproxy 改动
          # 原则: 不修改 adm1n5ky/luci-app-dnsproxy 上游仓库, 不改分支
          # 流程: 上游 clone → 依次 git apply patches/luci-app-dnsproxy/*.patch
          # 约束: patch 失败必须让 CI 失败（禁止 || true / 静默忽略）
          #       每次全新 clone → 重复执行天然幂等
          # ============================================================
          git clone --depth 1 https://github.com/adm1n5ky/luci-app-dnsproxy.git \
            package/luci-app-dnsproxy

          # 确保目录下确有 patch，否则明确失败
          if ! ls ../openwrt-build/patches/luci-app-dnsproxy/*.patch >/dev/null 2>&1; then
            echo "!!! 未找到 patches/luci-app-dnsproxy/*.patch，构建中止" >&2
            exit 1
          fi

          # 注意: 下面在 (cd package/... ) 子 shell 里执行 git apply，相对路径会失效，
          #       必须先转成绝对路径（以 lede/ 为基准解析）。
          for patch in ../openwrt-build/patches/luci-app-dnsproxy/*.patch; do
            abs_patch="$(cd "$(dirname "$patch")" && pwd)/$(basename "$patch")"
            echo ">>> 应用 patch: $abs_patch"
            (cd package/luci-app-dnsproxy && git apply --check "$abs_patch") || {
              echo "!!! patch 应用检查失败（上游可能已变更，需同步更新 $abs_patch）: $abs_patch" >&2
              exit 1
            }
            (cd package/luci-app-dnsproxy && git apply "$abs_patch")
            echo ">>> patch 应用成功: $abs_patch"
          done

          # 打印已应用改动，编译日志可确认 patch 生效
          echo "===== luci-app-dnsproxy 本地 patch 已生效改动 ==="
          git -C package/luci-app-dnsproxy diff --stat
          git -C package/luci-app-dnsproxy diff | head -80

      - name: Update and install feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Force feeds to latest commit (fix outdated packages)
        working-directory: lede
        run: |
          # 强制所有 feed 拉取最新 commit，避免编译出老旧版本
          for f in feeds/*/; do
            if [ -d "$f/.git" ]; then
              feed_name=$(basename "$f")
              echo ">>> 更新 feed: $feed_name"
              (cd "$f" && git fetch origin 2>&1 && git reset --hard @{upstream} 2>&1) || \
              (cd "$f" && default_branch=$(git remote show origin 2>/dev/null | sed -n 's/.*HEAD branch: //p') && \
                git reset --hard "origin/${default_branch:-master}" 2>&1) || true
            fi
          done
          # 重新生成 feed 索引，pick up 最新包
          ./scripts/feeds install -a

      - name: Align dnsproxy feed link (keep helloworld 0.83.0, drop packages 0.56.2)
        working-directory: lede
        run: |
          # packages feed 的 dnsproxy 为旧版(0.56.2)，与 helloworld feed 的
          # 新版(0.83.0) 包名冲突会导致构建二义性。仅保留 helloworld 的新版。
          # 注意: feeds install 对 helloworld/dnsproxy 的扫描链接存在不确定性，
          #       这里显式重建链接（与 feeds install 的标准格式一致），幂等且明确。
          # dnsproxy 的 init/config 由 openwrt-build/files overlay 提供。
          rm -rf package/feeds/packages/dnsproxy
          echo "Removed package/feeds/packages/dnsproxy (legacy 0.56.2)"
          mkdir -p package/feeds/helloworld
          ln -sfn ../../../feeds/helloworld/dnsproxy package/feeds/helloworld/dnsproxy
          echo "Linked package/feeds/helloworld/dnsproxy -> ../../../feeds/helloworld/dnsproxy"
          ls -l package/feeds/helloworld/dnsproxy/Makefile
          head -12 package/feeds/helloworld/dnsproxy/Makefile | grep -E "PKG_NAME|PKG_VERSION"

      - name: Generate base .config
        working-directory: lede
        run: |
          if [ "$TARGET" = "x86_64" ]; then
            cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF
          else
            echo "请在此处添加其他目标平台的 base 配置"
            exit 1
          fi
          make defconfig

      - name: Enable required packages (SSR-Plus, Trafficctl, i18n)
        working-directory: lede
        run: |
          # SSR-Plus 相关
          echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Iptables_Transparent_Proxy=y" >> .config
          echo "# CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Nftables_Transparent_Proxy is not set" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ChinaDNS_NG=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_MosDNS=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadow_TLS=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Kcptun=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_NaiveProxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Simple_Obfs=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_V2ray_Plugin=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Client=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_ShadowsocksR_Libev_Server=y" >> .config

          # 启用 trafficctl 及其中文语言包
          # i18n 包名由 luci.mk 推导，不是「luci-i18n-<PKG_NAME>-<lang>」：
          #   LUCI_NAME   = 目录名            = luci-app-trafficctl
          #   LUCI_TYPE   = 第 2 段           = app
          #   LUCI_BASENAME = patsubst luci-app-%,%,LUCI_NAME = trafficctl
          #   LuciTranslation 生成 Package/luci-i18n-$(LUCI_BASENAME)-zh-cn
          # 故正确符号为 luci-i18n-trafficctl-zh-cn。
          # 原写 luci-i18n-luci-app-trafficctl-zh-cn 从不匹配任何符号，
          # 被 confdata.c 静默忽略 → 中文包实际从未编入（本次修正）。
          echo "CONFIG_PACKAGE_luci-app-trafficctl=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-trafficctl-zh-cn=y" >> .config

          # ALL_DOH: dnsproxy + luci-app-dnsproxy + CA 证书（https-dns-proxy 已彻底移除）
          # 二进制来自 helloworld feed(0.83.0)，init/config 来自 openwrt-build/files
          echo "CONFIG_PACKAGE_dnsproxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-dnsproxy=y" >> .config
          echo "CONFIG_PACKAGE_ca-bundle=y" >> .config
          echo "CONFIG_PACKAGE_ca-certificates=y" >> .config

          # === 游戏网络优化内核模块 ===
          # TCP BBR 拥塞控制
          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> .config
          # Fullcone NAT (游戏 UDP NAT 穿透)
          echo "CONFIG_PACKAGE_iptables-mod-fullconenat=y" >> .config

          # === SQM / cake 上行整形（控制 50Mbps 上行瓶颈的排队时延）===
          # 实测现固件缺 tc 与 sch_cake.ko，导致 pppoe-wan 为 noqueue、无任何队列管理。
          # sqm-scripts 来自 coolsnowwolf/packages feed（v1.6.0 依赖 iptables 而非
          # nftables，与本固件 fw3/iptables 后端匹配）；tc 来自 iproute2 的 tc-tiny
          # （默认变体，提供 /sbin/tc）；kmod-sched-core 为 tc 的依赖。
          echo "CONFIG_PACKAGE_sqm-scripts=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config
          echo "CONFIG_PACKAGE_kmod-sched-cake=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ifb=y" >> .config
          echo "CONFIG_PACKAGE_kmod-sched-core=y" >> .config
          echo "CONFIG_PACKAGE_tc-tiny=y" >> .config

          # === 显式排除不用的文件服务 ===
          # 实测这两个服务对用户无用：vsftpd 监听 0.0.0.0:21 但无实际用途；
          # ksmbd 未配置任何 share（仅 globals），445 端口空转。
          # 注意: 必须在 make defconfig 之前写入，否则依赖解析会把它们重新选上。
          echo "# CONFIG_PACKAGE_vsftpd is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-app-vsftpd is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-i18n-vsftpd-zh-cn is not set" >> .config
          echo "# CONFIG_PACKAGE_ksmbd-server is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-app-ksmbd is not set" >> .config
          echo "# CONFIG_PACKAGE_luci-i18n-ksmbd-zh-cn is not set" >> .config
          echo "# CONFIG_PACKAGE_autosamba is not set" >> .config

          make defconfig

      - name: Verify SQM / i18n enabled and file services excluded
        working-directory: lede
        run: |
          # defconfig 会按依赖解析重算所有符号，可能把上面的排除项重新选上。
          # 这里显式复核，任一项不符即失败（不使用 || true）。
          echo "=== SQM / cake 相关（应全部为 =y）==="
          for sym in CONFIG_PACKAGE_sqm-scripts CONFIG_PACKAGE_kmod-sched-cake \
                     CONFIG_PACKAGE_kmod-ifb CONFIG_PACKAGE_kmod-sched-core \
                     CONFIG_PACKAGE_tc-tiny; do
            if grep -q "^${sym}=y$" .config; then
              echo "OK   ${sym}=y"
            else
              echo "FAIL ${sym} 未启用："
              grep -E "^#? ?${sym}[ =]" .config || echo "  (符号不存在于 .config)"
              exit 1
            fi
          done

          echo "=== luci-app-sqm（缺失只告警，不阻断）==="
          grep -q "^CONFIG_PACKAGE_luci-app-sqm=y$" .config \
            && echo "OK   CONFIG_PACKAGE_luci-app-sqm=y" \
            || echo "WARN luci-app-sqm 未启用（LuCI 里无 SQM 页面，但内核与脚本仍生效）"

          echo "=== trafficctl 中文语言包（符号名易写错，必须校验）==="
          # 正确符号：luci-i18n-trafficctl-zh-cn
          #   luci.mk 由目录名推导 LUCI_BASENAME=trafficctl，再生成
          #   Package/luci-i18n-$(LUCI_BASENAME)-$(lang)。
          # 历史错误写法 luci-i18n-luci-app-trafficctl-zh-cn 不匹配任何符号，
          # 会被 confdata.c 静默忽略，导致中文包从未编入 —— 故在此阻断。
          if grep -q "^CONFIG_PACKAGE_luci-i18n-trafficctl-zh-cn=y$" .config; then
            echo "OK   CONFIG_PACKAGE_luci-i18n-trafficctl-zh-cn=y"
          else
            echo "FAIL 中文语言包未启用，检查符号名是否写成 luci-i18n-luci-app-trafficctl-zh-cn"
            grep -E "^#? ?CONFIG_PACKAGE_luci-i18n-.*trafficctl.*=" .config || echo "  (无任何 trafficctl i18n 符号)"
            exit 1
          fi

          echo "=== 应被排除的文件服务（必须不为 =y）==="
          for sym in CONFIG_PACKAGE_vsftpd CONFIG_PACKAGE_ksmbd-server \
                     CONFIG_PACKAGE_autosamba; do
            if grep -q "^${sym}=y$" .config; then
              echo "FAIL ${sym} 仍被启用（依赖解析把它选回来了）"
              exit 1
            fi
            echo "OK   ${sym} 未启用"
          done

      - name: Apply gaming optimization files overlay
        working-directory: lede
        run: |
          # 将 openwrt-build/files/ 中的配置文件覆盖到固件 rootfs
          # OpenWrt 构建系统会在打包时将 files/ 目录内容合并到根文件系统
          if [ -d ../openwrt-build/files ]; then
            cp -r ../openwrt-build/files ./
            echo "Gaming optimization files copied to lede/files/"
            find files/ -type f | sort
          else
            echo "No files/ directory found in openwrt-build"
            exit 1
          fi
          # 关键脚本必须可执行（init/hotplug/uci-defaults 均需执行位，
          # 否则固件内 /etc/init.d/dnsproxy 等无法运行 → LuCI 服务控制全部失效）
          # 注意: 不使用 || true —— 文件缺失/权限异常必须让 CI 明确失败；
          #       仅对实际存在的目录执行 chmod（避免 glob 无匹配报错）。
          chmod +x files/etc/init.d/dnsproxy
          chmod +x files/etc/rc.local
          chmod +x files/etc/uci-defaults/*
          if [ -d files/etc/hotplug.d/iface ]; then chmod +x files/etc/hotplug.d/iface/*; fi
          if [ -d files/etc/hotplug.d/dhcp ]; then chmod +x files/etc/hotplug.d/dhcp/*; fi
          echo "files overlay 执行位设置完成:"
          ls -l files/etc/init.d/dnsproxy files/etc/uci-defaults/ files/etc/hotplug.d/iface/ files/etc/rc.local 2>/dev/null

      - name: Verify mosdns template contract (upstreams at line 14, reject before forward)
        working-directory: lede
        run: |
          # files/etc/ssrplus/mosdns-config.yaml 是本仓库对 SSR-Plus 模板的 overlay。
          # 它必须满足 SSR-Plus init 脚本（/etc/init.d/shadowsocksr 第 1283 行）的契约：
          #   awk -v line=14 'NR == line+1 {print text} 1'
          # 即 `upstreams:` 必须正好在第 14 行，否则 DoH 上游会被插到错误位置
          # → mosdns 配置损坏 → 23614 个 gfw_list 域名解析全部失败。
          # 该契约无法被 YAML 语法检查发现，故在此显式断言。
          # 同时断言 reject 规则排在 forward 之前（v0.4.0 的优化意图）。
          T=files/etc/ssrplus/mosdns-config.yaml
          [ -f "$T" ] || { echo "FAIL 缺少 $T"; exit 1; }

          line14="$(sed -n '14p' "$T" | sed 's/[[:space:]]*$//')"
          if [ "$line14" != "        upstreams:" ]; then
            echo "FAIL 模板第 14 行不是 'upstreams:'，实际为: [$line14]"
            echo "     这会让 init 脚本的 awk 把上游插错位置，mosdns 将无法启动。"
            sed -n '10,18p' "$T"
            exit 1
          fi
          echo "OK   第 14 行 = upstreams:"

          reject_ln="$(grep -n 'exec: reject 0' "$T" | head -1 | cut -d: -f1)"
          forward_ln="$(grep -n 'exec: \$forward_google' "$T" | head -1 | cut -d: -f1)"
          if [ -z "$reject_ln" ] || [ -z "$forward_ln" ]; then
            echo "FAIL 模板缺少 reject 或 forward 规则 (reject=$reject_ln forward=$forward_ln)"
            exit 1
          fi
          if [ "$reject_ln" -ge "$forward_ln" ]; then
            echo "FAIL reject (行 $reject_ln) 未排在 forward (行 $forward_ln) 之前"
            exit 1
          fi
          echo "OK   reject 行 $reject_ln < forward 行 $forward_ln"

          grep -q 'DNS_MODE' "$T" || { echo "FAIL 模板缺少 DNS_MODE 占位符"; exit 1; }
          grep -q 'DNS_PORT' "$T" || { echo "FAIL 模板缺少 DNS_PORT 占位符"; exit 1; }
          echo "OK   DNS_MODE / DNS_PORT 占位符存在"
          echo "mosdns 模板契约校验通过。"

      - name: Verify SSR-Plus uci-defaults ordering contract
        working-directory: lede
        run: |
          # files/etc/uci-defaults/99-gaming-optimize 会写 shadowsocksr.@global[0].*，
          # 但 uci-defaults 按**文件名排序**执行：'99-gaming-optimize' 先于
          # 'luci-ssr-plus'。而首次刷机时 /etc/config/shadowsocksr 由 opkg conffile
          # 提供、实测为 0 字节 —— 空配置上 `uci set shadowsocksr.@global[0].k=v`
          # 会以 `Entry not found` 失败（退出码 1），导致写入静默丢弃。
          # 本步骤断言该脚本含「空配置先铺底」的守卫，防止将来被改回。
          T=files/etc/uci-defaults/99-gaming-optimize
          [ -f "$T" ] || { echo "FAIL 缺少 $T"; exit 1; }

          # 1) 必须有「空文件 → 先 reset 铺底」的守卫（判据与 luci-ssr-plus 同源）
          if ! grep -q '\[ ! -s /etc/config/shadowsocksr \]' "$T"; then
            echo "FAIL 缺少「空配置先铺底」守卫。"
            echo "     uci-defaults 中本脚本先于 luci-ssr-plus 执行，首刷时"
            echo "     /etc/config/shadowsocksr 为 0 字节，直接 uci set @global[0] 会"
            echo "     以 'Entry not found' 静默失败，三项 SSR-Plus 设置全部丢失。"
            exit 1
          fi
          echo "OK   存在「空配置先铺底」守卫"

          # 2) 铺底必须调用 reset（模板来自 /usr/share/shadowsocksr/shadowsocksr.config）
          if ! grep -q '/etc/init.d/shadowsocksr reset' "$T"; then
            echo "FAIL 守卫存在但未调用 /etc/init.d/shadowsocksr reset（模板不会铺底）"
            exit 1
          fi
          echo "OK   铺底调用 /etc/init.d/shadowsocksr reset"

          # 3) 写 shadowsocksr.@global[0] 的每一**节**之前都应有段存在性守卫。
          #    计数规则：守卫行必须为 1 或 2 处，且存在写入；同一守卫可保护
          #    其后连续的多条写入（第 4.5 节即 1 个守卫保护 2 条写入），
          #    故不要求 guard_n >= set_n，而要求「每处守卫之后至少有一条写入」
          #    且写入均为带失败日志的形式（见步骤 4）。
          guard_n="$(grep -c 'uci -q get shadowsocksr.@global\[0\]' "$T")"
          set_n="$(grep -cE '^[[:space:]]*uci set shadowsocksr\.@global\[0\]' "$T")"
          echo "守卫数=$guard_n  写入数=$set_n"
          if [ "$guard_n" -lt 1 ]; then
            echo "FAIL 未找到段存在性守卫（空配置下写入会静默失败）"
            exit 1
          fi
          if [ "$set_n" -lt 1 ]; then
            echo "FAIL 未找到 @global[0] 写入（本脚本应设置 SSR-Plus 的 MOSDNS/AAAA 开关）"
            exit 1
          fi
          # 每一处守卫之后必须至少有一处写入，否则守卫是多余的或写入被移走
          last_guard="$(grep -n 'uci -q get shadowsocksr.@global\[0\]' "$T" | tail -1 | cut -d: -f1)"
          last_set="$(grep -nE '^[[:space:]]*uci set shadowsocksr\.@global\[0\]' "$T" | tail -1 | cut -d: -f1)"
          if [ "$last_set" -lt "$last_guard" ]; then
            echo "FAIL 最后一处守卫(行 $last_guard)之后没有写入(最后写入在行 $last_set)"
            exit 1
          fi
          echo "OK   守卫覆盖所有 @global[0] 写入"

          # 4) 禁止裸 uci set（无失败反馈）—— 红线 3：禁止静默失败。
          #    正则锚定行首非注释、且行尾非续行符 '\'（续行写法下一行才接日志）。
          #    注释行（以 # 开头）不计入 —— 第 4.5 节的说明文字里引用了该写法。
          if grep -nE '^[[:space:]]*uci set shadowsocksr\.@global\[0\]\.[^\\]*$' "$T" \
               | grep -vE ':[[:space:]]*#'; then
            echo "FAIL 存在未接失败日志的裸 uci set（应写成 'uci set ... || log ERROR ...'）"
            exit 1
          fi
          echo "OK   shadowsocksr.@global[0] 写入均带失败日志"

          # 5) MSS clamp 必须按后端分派（fw4 不加载 /etc/firewall.user）
          if ! grep -q '/etc/nftables.d/10-mss-clamp.nft' "$T"; then
            echo "FAIL 缺少 fw4(nftables) 后端的 MSS clamp 路径。"
            echo "     fw4 不加载 /etc/firewall.user，只写该文件等于死代码。"
            exit 1
          fi
          echo "OK   MSS clamp 含 fw4/nftables 分支"
          echo "SSR-Plus uci-defaults 顺序契约校验通过。"

      - name: Download package sources
        working-directory: lede
        run: make download -j${{ env.JOBS }} V=s

      - name: Prebuild gn host tool with gcc-13 (fix gcc-12 ranges compile error)
        working-directory: lede
        run: |
          # ---------------------------------------------------------------
          # 背景: helloworld feed 的 gn(2026-08-13, Chromium build tool) 是
          #       naiveproxy(SSR-Plus INCLUDE_NaiveProxy=y) 的 host 构建依赖
          #       (naiveproxy/Makefile: PKG_BUILD_DEPENDS:=gn/host)。
          #       gn 新版在 ubuntu-22.04 默认 gcc-12 上编译失败:
          #         src/gn/scope.h:241 values_ | std::views::transform(...)
          #         (libstdc++-12 ranges 适配不完整, gcc-13 已修复)
          # 方案: 安装 gcc-13, 用 CC=gcc-13 CXX=g++-13 预编译 gn 并落 .built
          #       stamp(OpenWrt stamp 机制), make world 时自动跳过 gn。
          # 约束: 不改 helloworld 上游代码、不关闭 SSR-Plus 任何组件、
          #       不影响 luci-app-dnsproxy 的 patch 流程。
          # ---------------------------------------------------------------
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-13 g++-13
          # gn 的 Host/Compile 使用 $(NINJA)，先确保 ninja host 工具就绪（幂等）
          make tools/ninja/compile V=s
          # gen.py 读取 CC/CXX 环境变量写入 build.ninja（gn 官方构建惯例），
          # 预编译成功即生成 hostpkg/gn-*/.built stamp
          CC=gcc-13 CXX=g++-13 make package/feeds/helloworld/gn/host/compile V=s
          ls -l staging_dir/hostpkg/bin/gn
          echo "gn host 工具(gcc-13) 预编译成功"

      - name: Compile firmware
        working-directory: lede
        run: |
          # Gaming optimized build
          # files/ will be merged into rootfs during image generation
          make -j${{ env.JOBS }} V=s

      # ------------------------------------------------------------------
      # 产物重命名：给固件文件名加上版本号，便于区分不同构建。
      # 原始名（OpenWrt 生成）:
      #   openwrt-x86-64-generic-ext4-combined-efi.img.gz
      # 重命名为:
      #   openwrt-x86-64-ssrplus-<VERSION>-<SHORT_SHA>-ext4-combined-efi.img.gz
      # 即把 openwrt-x86-64 之后的 "generic" 替换为 "ssrplus-vX.Y.Z-<sha>"，
      # 保留后缀（ext4-combined-efi / squashfs-combined 等），
      # 这样刷机工具与用户仍能从文件名辨认镜像类型。
      # 同时生成 .sha256 校验文件。
      # ------------------------------------------------------------------
      - name: Rename firmware with version
        working-directory: lede
        run: |
          set -e
          TAG="ssrplus-${VERSION}-${SHORT_SHA}"
          echo ">>> 版本标签: $TAG"
          ls -l bin/targets/x86/64/*.img.gz

          found=0
          for f in bin/targets/x86/64/*.img.gz; do
            [ -e "$f" ] || { echo "!!! 未找到任何 .img.gz 产物" >&2; exit 1; }
            base="$(basename "$f")"
            # openwrt-x86-64-generic-ext4-combined-efi.img.gz
            #   -> 前缀 openwrt-x86-64-
            #   -> 其余 generic-ext4-combined-efi.img.gz
            rest="${base#openwrt-x86-64-}"
            # 把开头的目标名（generic）换成版本标签，保留镜像类型后缀
            suffix="${rest#*-}"                     # ext4-combined-efi.img.gz
            case "$rest" in
              *-*) : ;;                             # 含 '-'，可安全切分
              *) echo "!!! 产物名不符合预期（缺目标名与类型分隔）: $base" >&2; exit 1 ;;
            esac
            new="openwrt-x86-64-${TAG}-${suffix}"
            mv "$f" "bin/targets/x86/64/$new"
            echo ">>> $base"
            echo "    -> $new"
            (cd bin/targets/x86/64 && sha256sum "$new" > "$new.sha256")
            cat "bin/targets/x86/64/$new.sha256"
            found=$((found+1))
          done
          [ "$found" -ge 1 ] || { echo "!!! 未重命名任何产物" >&2; exit 1; }
          echo ">>> 共重命名 $found 个产物"
          ls -l bin/targets/x86/64/

          # 断言：重命名结果必须真的带版本号，且仍以 .img.gz 结尾
          # （防止将来改坏命名逻辑却默默出包）
          for f in bin/targets/x86/64/*.img.gz; do
            b="$(basename "$f")"
            case "$b" in
              *"${VERSION}"*) : ;;
              *) echo "!!! 产物名不含版本号 ${VERSION}: $b" >&2; exit 1 ;;
            esac
            case "$b" in
              *.img.gz) : ;;
              *) echo "!!! 产物名未以 .img.gz 结尾: $b" >&2; exit 1 ;;
            esac
          done
          echo ">>> 产物命名校验通过（均含版本号 ${VERSION} 且以 .img.gz 结尾）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # artifact 名带版本号，便于在 Actions 页区分每次构建
          name: openwrt-x86-64-ssrplus-${{ env.VERSION }}-${{ env.SHORT_SHA }}
          path: |
            lede/bin/targets/x86/64/*.img.gz
            lede/bin/targets/x86/64/*.img.gz.sha256

      # ------------------------------------------------------------------
      # 发版（tag v* push）时：把编译产物上传到 GitHub Release。
      # release.yml 会先为该 tag 创建 Release（notes 取自 CHANGELOG 对应版本），
      # 本步在此上传固件文件；master push 场景跳过（只留 artifact）。
      # ------------------------------------------------------------------
      - name: Upload firmware to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME}"
          echo ">>> 将固件产物上传到 Release $VER"
          # 等待 release.yml 已创建 Release（通常秒级完成；此处最多等 60s）
          for i in $(seq 1 12); do
            if gh release view "$VER" >/dev/null 2>&1; then
              break
            fi
            echo "Release $VER 尚未就绪，等待 5s... ($i/12)"
            sleep 5
          done
          gh release view "$VER" >/dev/null 2>&1 || {
            echo "!!! Release $VER 不存在（release.yml 未运行？），改用 gh release create 兜底" >&2
            gh release create "$VER" --title "$VER" --notes "自动生成的 Release（CHANGELOG 日志见 release.yml 工作流）"
          }
          # 上传固件（幂等：文件已存在则跳过）
          # 产物已在 “Rename firmware with version” 步骤改名为带版本号形式，
          # 故这里同时上传 .img.gz 与 .sha256 校验文件。
          ls lede/bin/targets/x86/64/*.img.gz
          assets="$(gh release view "$VER" --json assets --jq '.assets[].name')"
          for f in lede/bin/targets/x86/64/*.img.gz lede/bin/targets/x86/64/*.img.gz.sha256; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            if printf '%s\n' "$assets" | grep -qx "$name"; then
              echo "已存在: $name，跳过"
            else
              gh release upload "$VER" "$f" --clobber
              echo "已上传: $name"
            fi
          done
          echo ">>> Release $VER 产物上传完成"
          gh release view "$VER" --json url --jq .url
