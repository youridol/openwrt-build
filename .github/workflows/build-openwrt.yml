name: Build OpenWrt with SSR-Plus and Trafficctl

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
    # 纯文档改动不触发编译。
    #
    # 为什么需要：这份流水线一次要跑约 3.5 小时（JOBS=2 编译整个 lede）。
    # 而 CHANGELOG.md / AGENTS.md / docs/ 的提交以前会白跑一次完整构建，
    # 还会与 tag 构建抢并发额度（v0.4.9/v0.4.10 期间我因此取消了 4 次冗余构建）。
    #
    # 安全性依据（GitHub 官方文档原文）：
    #   "Path filters are not evaluated for pushes of tags."
    # 即 paths-ignore **只对分支推送生效**，推 tag（v*）仍会照常触发，
    # 不会影响发版。tags 与 paths-ignore 写在同一层是官方允许的用法。
    #
    # 注意：不要改成 paths:（白名单）—— 那样以后新增任何目录都要记得同步，
    # 漏了就静默不构建；黑名单只需列出「确定与固件无关」的纯文档。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  TARGET: x86_64
  FEED_CONF: feeds.conf.default
  # 构建缓存 Release 的 tag，由 .github/workflows/cache-deps.yml 维护。
  #
  # 里面是 dl/ 源码包镜像与交叉工具链的分片，**不是固件**。
  # 用 `cache-` 前缀而不是 `v*`：本工作流的 tag 触发是 `v*`，
  # 若缓存也用 v 前缀，刷新缓存会误触发一次 3.5 小时的固件构建。
  CACHE_TAG: cache-build-v1

# 【必须】上传 Release 产物需要 contents: write。
#
# 为什么必须显式声明：本仓库的默认工作流令牌权限是 **read**
# （`gh api repos/.../actions/permissions/workflow`
#   -> {"default_workflow_permissions":"read"}）。
# 不声明就拿到只读令牌，`gh release upload` 会被拒：
#   HTTP 403: Resource not accessible by integration
#   (.../releases/<id>/assets?name=...)
# 而 release.yml 之所以能建 Release，正是因为它自己声明了
# `permissions: contents: write` —— 两个工作流的令牌是各自独立申请的。
#
# v0.4.5 ~ v0.4.11 期间「Release 建得出来、固件一个都传不上去」就是这个原因
# （叠加 GH_REPO 缺失，两个问题互相掩盖）。
#
# 另需 actions: read —— 末尾的「Assert firmware artifact exists」用
# `gh api .../actions/runs/<id>/artifacts` 查询本次 run 的产物。
# 声明 permissions 后**未列出的 scope 一律为 none**（不是回落到仓库默认 read），
# 故必须显式列出；否则该断言会以 403 失败，把一次正常构建判成红灯。
permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 先 checkout openwrt-build 仓库（含自定义 package/）
      - name: Checkout openwrt-build (custom packages)
        uses: actions/checkout@v4
        with:
          path: openwrt-build

      # ------------------------------------------------------------------
      # 版本号提取（唯一来源：CHANGELOG.md 顶部的 `## [vX.Y.Z] - YYYY-MM-DD`）。
      # 与 release.yml 的版本来源保持一致，避免两处版本号漂移。
      # 产物命名与 artifact 名均带该版本号，便于区分每次构建。
      # 输出的 VERSION（含 v 前缀）/ VERSION_NOV（不含 v）/ SHORT_SHA
      # 写入 $GITHUB_ENV，供后续所有步骤使用。
      # 必须放在 checkout 之后 —— 需要读取 openwrt-build/CHANGELOG.md。
      # ------------------------------------------------------------------
      - name: Resolve version from CHANGELOG
        working-directory: openwrt-build
        run: |
          # 取 CHANGELOG 中第一个版本标题行
          VER_LINE="$(grep -m1 '^## \[v' CHANGELOG.md || true)"
          if [ -z "$VER_LINE" ]; then
            echo "!!! CHANGELOG.md 顶部找不到 '## [vX.Y.Z]' 版本标题，构建中止" >&2
            echo "    （产物需要版本号，无版本号不允许出包）" >&2
            exit 1
          fi
          # 从 `## [v0.4.3] - 2026-10-09` 中提取 v0.4.3
          VERSION="$(printf '%s\n' "$VER_LINE" | sed -n 's/^## \[\(v[^]]*\)\].*/\1/p')"
          if [ -z "$VERSION" ]; then
            echo "!!! 无法从版本标题解析版本号: [$VER_LINE]" >&2
            exit 1
          fi
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;   # 形如 v1.2.3，接受
            *)
              echo "!!! 版本号格式异常（应为 vMAJOR.MINOR.PATCH）: [$VERSION]" >&2
              exit 1
              ;;
          esac

          # ── 防止版本号静默错位（v0.9.0 首次构建踩过）─────────────
          # 上面的 grep 用 '^## \[v' 取第一条**带 [v 的**标题。
          # 若 CHANGELOG 顶部写成 `## [未发布]`，它不匹配 `[v`，于是被跳过，
          # 结果取到了下面那个**旧版本**，产物名变成旧版本号 —— 构建全程无报错，
          # 只有产物的文件名能看出来（v0.9.0 首次构建产物名是 v0.8.6-f39f3cd）。
          #
          # 判据：第一条 `## [` 标题必须就是 `## [v...`。
          FIRST_H2="$(grep -m1 '^## \[' CHANGELOG.md || true)"
          if [ "$FIRST_H2" != "$VER_LINE" ]; then
            echo "!!! CHANGELOG 第一条 '## [' 标题不是版本标题，版本号会静默错位" >&2
            echo "    第一条: [$FIRST_H2]" >&2
            echo "    取到的: [$VER_LINE]" >&2
            echo "    修法: 把顶部的「未发布」等占位标题改成 '## [vX.Y.Z] - YYYY-MM-DD'" >&2
            exit 1
          fi
          echo "OK   版本标题位于 CHANGELOG 首条 '## [' 位置"

          VERSION_NOV="${VERSION#v}"
          # 构建号：短 SHA，便于同一版本多次构建时区分
          SHORT_SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          echo "CHANGELOG 顶部版本: $VERSION (构建号 $SHORT_SHA)"
          {
            echo "VERSION=$VERSION"
            echo "VERSION_NOV=$VERSION_NOV"
            echo "SHORT_SHA=$SHORT_SHA"
          } >> "$GITHUB_ENV"

      - name: Checkout lede source
        uses: actions/checkout@v4
        with:
          repository: coolsnowwolf/lede
          ref: master
          path: lede

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils-extra rsync unzip zlib1g-dev \
            file wget subversion upx-ucl autoconf automake curl asciidoc libtool

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Set JOBS
        # GHA runner 只有 7GB 内存，Go 编译 Xray 吃内存，限制并行度防 OOM
        run: echo "JOBS=2" >> $GITHUB_ENV

      - name: Add helloworld feed (dedup-safe)
        working-directory: lede
        run: |
          # 注意: lede feeds.conf.default 自 2026 年起已自带 helloworld feed,
          # 旧写法直接追加会导致 "Duplicate feed name 'helloworld'" → feeds update
          # 失败 (exit 25) → 整个构建中止。这里先判重、仅当缺失时才追加, 幂等。
          grep -q '^src-git helloworld' "$FEED_CONF" 2>/dev/null || \
            echo "src-git helloworld https://github.com/fw876/helloworld" >> "$FEED_CONF"
          echo "--- feeds.conf helloworld 条目 ---"
          grep '^src-git helloworld' "$FEED_CONF"

      - name: Add luci-app-trafficctl (本地包，含中文翻译)
        working-directory: lede
        run: |
          cp -r ../openwrt-build/package/luci-app-trafficctl package/

      - name: Add luci-app-dnschain (本地包，DNS 链路控制页面)
        working-directory: lede
        run: |
          # v0.9.0 首次构建漏了这一步：package/luci-app-dnschain 从未被复制进
          # lede/package/，也没在 .config 里启用 → 固件里一个页面文件都没有
          # （实测：squashfs 里 luci-app-dnschain 相关条目数 = 0）。
          # 症状极其隐蔽：构建全绿、artifact 正常产出，只是打开 LuCI 没有那个页面。
          if [ ! -d ../openwrt-build/package/luci-app-dnschain ]; then
            echo "!!! 缺少 ../openwrt-build/package/luci-app-dnschain" >&2
            exit 1
          fi
          cp -r ../openwrt-build/package/luci-app-dnschain package/
          echo "--- 已复制，目录内容 ---"
          find package/luci-app-dnschain -type f | sort

          # 断言关键文件都在（缺任一都说明包不完整）
          for f in Makefile \
                   luasrc/controller/dnschain.lua \
                   luasrc/model/cbi/dnschain/general.lua \
                   luasrc/model/cbi/dnschain/dnschain.lua \
                   luasrc/model/cbi/dnschain/diagrams.lua \
                   htdocs/luci-static/resources/dnschain/dnschain.css \
                   htdocs/luci-static/resources/dnschain/dnschain.js \
                   root/usr/share/luci/menu.d/luci-app-dnschain.json \
                   root/usr/share/rpcd/acl.d/luci-app-dnschain.json \
                   po/zh-cn/luci-app-dnschain.po ; do
            if [ -f "package/luci-app-dnschain/$f" ]; then
              echo "OK   $f"
            else
              echo "FAIL 缺少 package/luci-app-dnschain/$f" >&2
              exit 1
            fi
          done

          # 断言运行时组件也在
          #
          # v0.22.0：dnschain-health 与 dnschain-triage 已删除
          # （健康改道与分诊整体移除，改由 dnsproxy --fallback 承担
          #   「直连不通自动改走代理」），故本断言只剩库文件。
          #
          # 契约校验与图示自检由后续步骤负责：
          #   verify-...domains.sh   契约校验
          #   render-...diagrams.py  图示几何自检
          for f in files/usr/share/dnschain/dnschain.sh ; do
            if [ -f "../openwrt-build/$f" ]; then
              echo "OK   $f"
            else
              echo "FAIL 缺少 $f（域名分流与自动改道功能不完整）" >&2
              exit 1
            fi
          done

          # 新脚本必须有执行位 —— 缺了它 rpcd 调不动，
          # 页面所有按钮都会静默失败（点「立即探测」没反应）。
          # v0.22.0：断言范围扩到全部 5 个运行时脚本。
          #
          # 原来只查 dnschain-reconcile，其余 4 个漏检 —— 而实测它们
          # 在 git 索引里全是 100644（无执行位），本地因 Windows 文件系统
          # 不体现权限位而看不出来，CI 检出后才暴露。
          # 症状：脚本不可执行 → 页面所有按钮静默失败、init 脚本起不来。
          #
          # 修法是在 git 索引里设权限（不是 chmod 工作树）：
          #   git update-index --chmod=+x <file>
          for f in files/usr/bin/dnschain-reconcile \
                   files/usr/bin/dnschain-selftest \
                   files/etc/init.d/dnschain \
                   files/etc/uci-defaults/99-zz-dnschain \
                   files/usr/share/dnschain/dnschain.sh ; do
            if [ -x "../openwrt-build/$f" ]; then
              echo "OK   $f 有执行位"
            else
              echo "FAIL $f 缺执行位（页面按钮会静默失败）" >&2
              exit 1
            fi
          done

          # 断言视觉规范层的两条不变量（v0.12.0）
          #
          # ① CSS 必须同时定义浅色与暗色两套语义色令牌。
          #    只写一套时，shadcn 主题切到暗色会出现「绿徽标配浅背景」
          #    这种低对比组合（实测暗色下 dc-badge--ok 几乎看不清）。
          # ② 两份资源都不能为空 —— 空文件会让页面静默退化成无样式，
          #    而构建与运行时都不报错。
          CSS=package/luci-app-dnschain/htdocs/luci-static/resources/dnschain/dnschain.css
          JS=package/luci-app-dnschain/htdocs/luci-static/resources/dnschain/dnschain.js

          if grep -q 'data-darkmode="true"' "$CSS"; then
            echo "OK   CSS 含暗色令牌"
          else
            echo "FAIL CSS 缺少 html[data-darkmode] 暗色令牌块" >&2
            exit 1
          fi

          for tok in --dc-ok --dc-warn --dc-bad --dc-info; do
            n=$(grep -c -- "$tok:" "$CSS" || true)
            if [ "$n" -ge 2 ]; then
              echo "OK   $tok 定义 $n 次（浅色 + 暗色）"
            else
              echo "FAIL $tok 只定义 $n 次，暗色主题会缺色" >&2
              exit 1
            fi
          done

          for f in "$CSS" "$JS"; do
            sz=$(wc -c < "$f")
            if [ "$sz" -gt 500 ]; then
              echo "OK   $(basename $f) ${sz}B"
            else
              echo "FAIL $(basename $f) 只有 ${sz}B，疑似空文件" >&2
              exit 1
            fi
          done

          # 断言「空 tabmenu 必须被收掉」（v0.12.2）
          #
          # CBI 为每个 Map 生成 <ul class="cbi-tabmenu">。本页 section 都用
          # TypedSection/NamedSection、没有声明原生 tab，所以它的 <li> 全是
          # display:none —— 但 <ul> 仍带主题背景色，会渲染成一条 6×36px 的
          # 灰色竖条卡在描述与自建 tab 栏之间（v0.12.2 修的就是这个）。
          #
          # CSS 的 :has() 规则与 JS 的 dropEmptyTabmenu() 必须都在，
          # 缺 CSS 会在现代浏览器出现灰条，缺 JS 会在老 WebKit 出现灰条。
          if grep -q 'cbi-tabmenu:not(:has(' "$CSS"; then
            echo "OK   CSS 含空 tabmenu 收拢规则"
          else
            echo "FAIL CSS 缺少 .cbi-tabmenu:not(:has(...)) 规则（灰条会回来）" >&2
            exit 1
          fi

          if grep -q 'dropEmptyTabmenu' "$JS"; then
            echo "OK   JS 含 dropEmptyTabmenu 兜底"
          else
            echo "FAIL JS 缺少 dropEmptyTabmenu()（老 WebKit 会出现灰条）" >&2
            exit 1
          fi

          # 断言 tab 栏上方不留元数据容器（v0.12.1）
          # 承载 data-dc-meta 的 section 若未收起，会在 tab 栏上方留 11px 空白。
          if grep -q 'data-dc-meta' "$CSS"; then
            echo "OK   CSS 含 data-dc-meta 容器收拢规则"
          else
            echo "FAIL CSS 缺少 [data-dc-meta] 收拢规则" >&2
            exit 1
          fi

          # 断言布局不溢出（v0.12.3）
          #
          # 三处实测过的溢出源，缺任一都会在特定宽度下把内容顶出卡片：
          #  ① 链路图 SVG 不能写死 max-width —— 容器比它宽时会左贴边、
          #     右侧留空，视觉上像偏右溢出。必须 width:100% 交给 viewBox。
          #  ② 表格必须套 .dc-table-wrap 滚动容器 —— 窄屏下 5 列放不进卡片，
          #     实测溢出 31px。
          #  ③ 链路图要有 min-width 兜底 —— 容器窄于可读宽度时改横向滚动，
          #     否则节点文字被压到不可读。
          if grep -qE '^\.dc-chain svg *\{[^}]*max-width' "$CSS"; then
            echo "FAIL .dc-chain svg 又写死了 max-width（会左贴边、右侧留空）" >&2
            exit 1
          else
            echo "OK   链路图未写死 max-width"
          fi

          if grep -q 'dc-table-wrap' "$CSS"; then
            echo "OK   CSS 含表格滚动容器"
          else
            echo "FAIL CSS 缺少 .dc-table-wrap（窄屏表格会溢出）" >&2
            exit 1
          fi

          if grep -q 'dc-chain svg' "$CSS" && grep -q 'min-width' "$CSS"; then
            echo "OK   链路图有 min-width 兜底"
          else
            echo "FAIL 链路图缺少 min-width（窄屏文字会被压扁）" >&2
            exit 1
          fi

          # 断言「整块内容行」取消标签列（v0.12.4）
          #
          # CBI 的 .cbi-value 标签列固定 160px。概览里放链路图/指标条/
          # 统计卡/表格的那 4 行标签只有 4 个汉字，左侧白空 193px
          # （用户报的「左边留白很大」）。必须用 :has() 把它们改成竖排，
          # 并有 JS 兜底供不支持 :has() 的浏览器使用。
          if grep -q 'cbi-value:has(> .cbi-value-field > .dc-chain)' "$CSS"; then
            echo "OK   CSS 含整块内容行竖排规则"
          else
            echo "FAIL CSS 缺少 .cbi-value:has(... > .dc-chain) 竖排规则（左侧会留白 193px）" >&2
            exit 1
          fi

          for cls in dc-metrics dc-table-wrap dc-stats dc-badge dc-alert; do
            if grep -q "cbi-value:has(> .cbi-value-field > .$cls)" "$CSS"; then
              echo "OK   $cls 已纳入竖排规则"
            else
              echo "FAIL $cls 未纳入竖排规则（该行会左留白）" >&2
              exit 1
            fi
          done

          if grep -q 'markBlockRows' "$JS"; then
            echo "OK   JS 含 markBlockRows 兜底"
          else
            echo "FAIL JS 缺少 markBlockRows()（老 WebKit 会左留白）" >&2
            exit 1
          fi

          if grep -q 'dc-block-row' "$CSS" && grep -q 'dc-block-row' "$JS"; then
            echo "OK   .dc-block-row 兜底类在 CSS 与 JS 都有"
          else
            echo "FAIL .dc-block-row 兜底类不完整" >&2
            exit 1
          fi

          # 视图层的全部表格都必须套滚动容器
          #
          # v0.13.0 起数量不再是固定 3 个（「域名」tab 新增 3 个表格），
          # 故改成「开闭数量必须相等且 >= 3」—— 数量对得上才是关键，
          # 写死数字会让每次加表格都要改 CI，而改 CI 时最容易
          # 顺手把断言删掉（那就等于没有断言）。
          #
          # ⚠️ 「开」的判据只认 `<div class="dc-table-wrap"` 这个**前缀**，
          # 不能再要求后面紧跟 `"><table class="dc-table`。
          # v0.16.3 给分诊表格加了额外属性：
          #   '<div class="dc-table-wrap" data-dc-triage="1"><table class="dc-table">'
          # 旧的紧邻判据匹配不到它 → 开 6 / 闭 7 → 断言误报失败
          # （run 40068902046 与 40054362238 都栽在这里）。
          # 判据放宽到前缀后，加任何属性都不会再误报，而「开闭必须相等」
          # 这个真正要守的性质不变。
          GEN=package/luci-app-dnschain/luasrc/model/cbi/dnschain/general.lua
          DIA=package/luci-app-dnschain/luasrc/model/cbi/dnschain/diagrams.lua
          opened=$(grep -c 'dc-table-wrap"' "$GEN" || true)
          closed=$(grep -c '</tbody></table></div>' "$GEN" || true)
          if [ "$opened" -ge 3 ] && [ "$opened" = "$closed" ]; then
            echo "OK   $opened 个表格均已套滚动容器（开/闭各 $opened）"
          else
            echo "FAIL 表格滚动容器数量不对：开 $opened / 闭 $closed（应相等且 >= 3）" >&2
            exit 1
          fi

          # 链路拓扑图 viewBox 必须能容纳最右节点（v0.22.0 重写）
          #
          # ⚠️ 原断言查的是 general.lua 里「判定链路图」的
          #    `local W, H = ...` / `X1..X4` / `NW, NH` / `GAP` 四组常量。
          #    那张图（`route_map`）已在 v0.19.0 删除，常量随之消失 ——
          #    断言于是永久失败（实测 run 40127000136 就栽在这里，
          #    且失败时**不打印 FAIL 行**，只有 exit code 1，极难定位）。
          #
          #    现在查 diagrams.lua 里 `live_diag_map` 的真实常量：
          #      LIVE_W       画布宽
          #      LIVE_X3      证据框 x
          #      LIVE_EVID_W  证据框宽
          #    最右元素右边缘 = LIVE_X3 + LIVE_EVID_W，必须 < LIVE_W。
          LIVEW=$(grep -oE '^local LIVE_W = [0-9]+' "$DIA" | grep -oE '[0-9]+$')
          LIVEX3=$(grep -oE '^local LIVE_X3 = [0-9]+' "$DIA" | grep -oE '[0-9]+$')
          LIVEEW=$(grep -oE '^local LIVE_EVID_W = [0-9]+' "$DIA" | grep -oE '[0-9]+$')
          if [ -n "$LIVEW" ] && [ -n "$LIVEX3" ] && [ -n "$LIVEEW" ]; then
            LIVE_NEED=$((LIVEX3 + LIVEEW))
            if [ "$LIVEW" -gt "$LIVE_NEED" ]; then
              echo "OK   链路拓扑图 viewBox $LIVEW > 最右元素右边缘 $LIVE_NEED（留 $((LIVEW - LIVE_NEED))px）"
            else
              echo "FAIL 链路拓扑图 viewBox $LIVEW 容不下最右元素（右边缘 $LIVE_NEED）" >&2
              exit 1
            fi
          else
            echo "FAIL 无法解析链路拓扑图几何常量（LIVE_W/LIVE_X3/LIVE_EVID_W）" >&2
            exit 1
          fi

          # 断言链路图是「思维导图」形态（v0.12.5）
          #
          # 用户要求：连线要有弧度、不能断链。三个判据：
          #  ① 必须用贝塞尔 C 指令画分叉（直角折线 H/V 会形成硬拐角，像断链）
          #  ② 箭头必须按状态色分别定义 —— 只定义一个固定灰色时，
          #     红/绿连线配灰箭头，看起来像没连上
          #  ③ 曲线控制点必须满足 c1x <= c2x —— 否则曲线在中间兜回来、
          #     出现自交扭结（实测踩过：C 415 169, 373 85, 424 85）
          # v0.22.0：贝塞尔曲线函数 `curve()` 在 diagrams.lua（三张图共用），
          # 不在 general.lua —— 原断言查错了文件。
          if grep -q 'd="M %d %d C %d %d, %d %d, %d %d"' "$DIA"; then
            echo "OK   图示用贝塞尔 C 指令画分叉"
          else
            echo "FAIL 图示缺少贝塞尔曲线（H/V 直角折线会像断链）" >&2
            exit 1
          fi

          # v0.15.0：箭头全部移除（用户要求）。断言改为**反向条件** ——
          # 不得再生成任何 marker 定义或 marker-end 引用。
          # 三处独立实现都要查：general.lua 的内联链路图 + diagrams.lua 的两个函数。
          #
          # ⚠️ 必须先剥掉整行 Lua 注释（`--`）再判断。
          #    这两处的注释里都写了「v0.15.0 移除了 marker-end」这类说明文字，
          #    不剥注释会让断言永久误报 —— 本仓库已踩过同类问题
          #    （AGENTS.md 第 6 条：v0.4.7 的 nft 守卫、v0.4.10 的
          #    setInterval 守卫都栽在「解释错误写法的注释」上）。
          gen_code=$(grep -v '^[[:space:]]*--' "$GEN")
          dia_code=$(grep -v '^[[:space:]]*--' "$DIA")

          if printf '%s\n' "$gen_code" | grep -q 'marker("dc-a-'; then
            echo "FAIL general.lua 内联链路图仍有箭头（v0.15.0 要求移除）" >&2
            exit 1
          fi
          if printf '%s\n' "$gen_code" | grep -q 'marker-end'; then
            echo "FAIL general.lua 仍有 marker-end 引用" >&2
            exit 1
          fi
          echo "OK   general.lua 内联链路图无箭头"

          if printf '%s\n' "$dia_code" | grep -q 'marker-end'; then
            echo "FAIL diagrams.lua 仍有 marker-end 引用" >&2
            exit 1
          fi
          if printf '%s\n' "$dia_code" | grep -q '<marker'; then
            echo "FAIL diagrams.lua 仍生成 <marker> 定义" >&2
            exit 1
          fi
          echo "OK   diagrams.lua 无箭头"

          # 图身份标记仍在（无副作用，替代原来的 marker id 前缀）
          if printf '%s\n' "$dia_code" | grep -q 'data-dc-figure'; then
            echo "OK   图身份用 data-dc-figure 标记（同页多图可区分）"
          else
            echo "FAIL 缺少 data-dc-figure 图身份标记" >&2
            exit 1
          fi

          # v0.22.0：`curve()` 在 diagrams.lua（三张图共用），不在 general.lua。
          if grep -q 'local cap = math.floor((x2 - x1) / 2)' "$DIA"; then
            echo "OK   曲线控制点有交叉保护（dx <= 跨度/2）"
          else
            echo "FAIL 曲线缺少控制点交叉保护（会出现自交扭结）" >&2
            exit 1
          fi

          # 节点必须有填充 —— fill="none" 时连线会从节点内部透出，看起来像断链
          # v0.22.0：节点绘制函数 `box()` 在 diagrams.lua，不在 general.lua。
          if grep -q 'fill="var(--dc-surface)" stroke="%s"' "$DIA"; then
            echo "OK   节点有填充（连线不会透出）"
          else
            echo "FAIL 节点 fill 不是 --dc-surface（连线会透出，像断链）" >&2
            exit 1
          fi

          # ── v0.13.0：域名分流与自动改道的契约 ──────────────────────
          #
          # 这一整块抽到 tools/verify-dnschain-domains.sh 里，理由同
          # trafficctl 的 invariants 脚本：断言较多（88 条）、本地要能
          # 直接复跑，内联在 YAML 里无法本地执行，只能靠 push 后看 CI 日志。
          #
          # 该步骤的 working-directory 是 lede，而脚本在仓库根，
          # 故用 ../openwrt-build 前缀。
          if [ ! -f ../openwrt-build/tools/verify-dnschain-domains.sh ]; then
            echo "FAIL 缺少 tools/verify-dnschain-domains.sh" >&2
            exit 1
          fi
          if sh ../openwrt-build/tools/verify-dnschain-domains.sh; then
            echo "OK   域名分流与改道契约校验通过"
          else
            echo "FAIL 域名分流与改道契约校验失败（见上方 FAIL 行）" >&2
            exit 1
          fi

      - name: Fetch luci-theme-shadcn (默认 LuCI 主题)
        working-directory: lede
        run: |
          # ── 为什么用 git clone 而不是 feed ────────────────────────
          #
          # 该主题不在 lede 的任何 feed 里（自建仓库），且它的 main.css 与
          # 字体文件已预构建并入库（实测 htdocs/luci-static/shadcn/main.css
          # 134262 字节、6 个 woff2），故**不需要前端构建**，直接当
          # LuCI 包编译即可。
          #
          # 用固定 commit 而不是 main：主题更新会改 CSS/JS 结构，
          # 与 LuCI 版本不匹配时表现为「页面样式错乱」而非报错，
          # 固定 commit 才能保证同一份固件可重现。
          # 升级时只改 THEME_REF 并重跑。
          #
          # 注意: 不要放进 feeds.conf —— feed 机制会拉全部分支且
          # 没有 commit 固定，出问题后很难定位是哪个版本引入的。
          THEME_REPO="https://github.com/youridol/luci-theme-shadcn.git"
          THEME_REF="main"

          rm -rf /tmp/luci-theme-shadcn
          git clone --depth 1 --branch "$THEME_REF" "$THEME_REPO" /tmp/luci-theme-shadcn
          THEME_SHA=$(git -C /tmp/luci-theme-shadcn rev-parse HEAD)
          echo "主题 commit: $THEME_SHA"

          # 只复制构建需要的部分。.dev / .husky / .github / node_modules 等
          # 是开发工具链，进了固件会白占空间。
          DEST=package/luci-theme-shadcn
          rm -rf "$DEST"
          mkdir -p "$DEST"
          for item in Makefile root htdocs ucode LICENSE; do
            if [ -e "/tmp/luci-theme-shadcn/$item" ]; then
              cp -r "/tmp/luci-theme-shadcn/$item" "$DEST/"
            fi
          done

          echo "--- 复制后的内容 ---"
          find "$DEST" -maxdepth 2 | sort | head -20

          # 契约断言：缺任何一个都说明主题包不完整，编出来会白屏
          echo "--- 关键文件断言 ---"
          for f in Makefile \
                   root/etc/uci-defaults/30_luci-theme-shadcn \
                   htdocs/luci-static/shadcn/main.css \
                   htdocs/luci-static/shadcn/login.css ; do
            if [ -f "$DEST/$f" ]; then
              echo "OK   $f ($(stat -c%s "$DEST/$f") 字节)"
            else
              echo "FAIL 缺少 $f（主题会白屏或无法启用）" >&2
              exit 1
            fi
          done

          # main.css 不能是空壳（预构建产物应有百 KB 级）
          css_size=$(stat -c%s "$DEST/htdocs/luci-static/shadcn/main.css")
          if [ "$css_size" -lt 20000 ]; then
            echo "FAIL main.css 只有 $css_size 字节，疑似未预构建（应 > 100KB）" >&2
            exit 1
          fi
          echo "OK   main.css $css_size 字节（已预构建）"

          # 记下 commit 供产物命名/溯源
          echo "THEME_SHA=$THEME_SHA" >> "$GITHUB_ENV"

      - name: Verify invariants script is POSIX sh (dash) compatible
        working-directory: openwrt-build
        run: |
          # 【必须排在「跑断言」之前】
          # 该脚本的失败形态之一是**解析期**语法错误，报错只有一句
          #   tools/verify-trafficctl-invariants.sh: 494: Syntax error: "(" unexpected
          # 既没有 FAIL 行也没有断言上下文，极易被误判成「某条断言不通过」。
          # 这里先用 `sh -n` 做纯解析检查，让同类问题在日志里有一句明确的
          # 「用了 bash 专有语法」，而不是让人去猜第 494 行出了什么事。
          if ! sh -n tools/verify-trafficctl-invariants.sh; then
            echo "!!! tools/verify-trafficctl-invariants.sh 含 bash 专有语法，dash 无法解析。" >&2
            echo "    CI 用 /bin/sh（dash）执行该脚本；进程替换 <(...)、[[ ]]、数组、" >&2
            echo "    local/function 关键字都会在解析期直接 Syntax error，构建不会开始。" >&2
            echo "    需要临时文件请写进脚本里的 \$TMPD（已在脚本头部建立）。" >&2
            exit 1
          fi
          echo "OK   tools/verify-trafficctl-invariants.sh 可被 dash 解析"

      - name: Verify luci-app-trafficctl local invariants (速度监控 / 中文翻译 / 刷新)
        working-directory: openwrt-build
        run: |
          # 这一步的全部断言都在 tools/verify-trafficctl-invariants.sh 里。
          #
          # 为什么抽成脚本而不是写在 YAML 里：
          #   1. 断言较多（含一段 python 用来按 git 索引修正文件模式），内联在
          #      YAML 里容易因缩进/heredoc 出错，且无法在本地直接跑；
          #   2. 抽出来后本地可 `sh tools/verify-trafficctl-invariants.sh` 复现，
          #      CI 与本地用同一份逻辑，不会出现「本地过了 CI 挂」。
          #
          # 该脚本校验的核心是「四项本地改动仍在」+「patch 可复现 vendored 包」，
          # 详见脚本头部注释与 AGENTS.md 红线 9。
          #
          # 【调用方式必须保持 `sh`】runner 的 /bin/sh 是 dash。用 bash 调用会让
          # bash 专有语法（进程替换 `<(...)` 等）通过本地自测，却在 CI 解析期
          # 直接 `Syntax error` → exit 2 → 编译根本不会开始。
          # v0.8.4 的 tag 构建与 10-18/10-19 两次定时构建正是这样连续失败三天。
          sh tools/verify-trafficctl-invariants.sh

      - name: Fetch luci-app-dnsproxy upstream and apply local patches (ALL_DOH)
        working-directory: lede
        run: |
          # ============================================================
          # ALL_DOH: 以 patch 形式在 openwrt-build 维护 luci-app-dnsproxy 改动
          # 原则: 不修改 adm1n5ky/luci-app-dnsproxy 上游仓库, 不改分支
          # 流程: 上游 clone → 依次 git apply patches/luci-app-dnsproxy/*.patch
          # 约束: patch 失败必须让 CI 失败（禁止 || true / 静默忽略）
          #       每次全新 clone → 重复执行天然幂等
          # ============================================================
          git clone --depth 1 https://github.com/adm1n5ky/luci-app-dnsproxy.git \
            package/luci-app-dnsproxy

          # 确保目录下确有 patch，否则明确失败
          if ! ls ../openwrt-build/patches/luci-app-dnsproxy/*.patch >/dev/null 2>&1; then
            echo "!!! 未找到 patches/luci-app-dnsproxy/*.patch，构建中止" >&2
            exit 1
          fi

          # 注意: 下面在 (cd package/... ) 子 shell 里执行 git apply，相对路径会失效，
          #       必须先转成绝对路径（以 lede/ 为基准解析）。
          for patch in ../openwrt-build/patches/luci-app-dnsproxy/*.patch; do
            abs_patch="$(cd "$(dirname "$patch")" && pwd)/$(basename "$patch")"
            echo ">>> 应用 patch: $abs_patch"
            (cd package/luci-app-dnsproxy && git apply --check "$abs_patch") || {
              echo "!!! patch 应用检查失败（上游可能已变更，需同步更新 $abs_patch）: $abs_patch" >&2
              exit 1
            }
            (cd package/luci-app-dnsproxy && git apply "$abs_patch")
            echo ">>> patch 应用成功: $abs_patch"
          done

          # 打印已应用改动，编译日志可确认 patch 生效
          echo "===== luci-app-dnsproxy 本地 patch 已生效改动 ==="
          git -C package/luci-app-dnsproxy diff --stat
          git -C package/luci-app-dnsproxy diff | head -80

      - name: Update and install feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Force feeds to latest commit (fix outdated packages)
        working-directory: lede
        run: |
          # 强制所有 feed 拉取最新 commit，避免编译出老旧版本
          for f in feeds/*/; do
            if [ -d "$f/.git" ]; then
              feed_name=$(basename "$f")
              echo ">>> 更新 feed: $feed_name"
              (cd "$f" && git fetch origin 2>&1 && git reset --hard @{upstream} 2>&1) || \
              (cd "$f" && default_branch=$(git remote show origin 2>/dev/null | sed -n 's/.*HEAD branch: //p') && \
                git reset --hard "origin/${default_branch:-master}" 2>&1) || true
            fi
          done
          # 重新生成 feed 索引，pick up 最新包
          ./scripts/feeds install -a

      - name: Align dnsproxy feed link (keep helloworld 0.83.0, drop packages 0.56.2)
        working-directory: lede
        run: |
          # packages feed 的 dnsproxy 为旧版(0.56.2)，与 helloworld feed 的
          # 新版(0.83.0) 包名冲突会导致构建二义性。仅保留 helloworld 的新版。
          # 注意: feeds install 对 helloworld/dnsproxy 的扫描链接存在不确定性，
          #       这里显式重建链接（与 feeds install 的标准格式一致），幂等且明确。
          # dnsproxy 的 init/config 由 openwrt-build/files overlay 提供。
          rm -rf package/feeds/packages/dnsproxy
          echo "Removed package/feeds/packages/dnsproxy (legacy 0.56.2)"
          mkdir -p package/feeds/helloworld
          ln -sfn ../../../feeds/helloworld/dnsproxy package/feeds/helloworld/dnsproxy
          echo "Linked package/feeds/helloworld/dnsproxy -> ../../../feeds/helloworld/dnsproxy"
          ls -l package/feeds/helloworld/dnsproxy/Makefile
          head -12 package/feeds/helloworld/dnsproxy/Makefile | grep -E "PKG_NAME|PKG_VERSION"

      - name: Generate base .config
        working-directory: lede
        run: |
          # 配方已抽到 tools/gen-openwrt-config.sh —— 与
          # .github/workflows/cache-deps.yml（定时预热 dl 镜像）**共用同一份**。
          #
          # 为什么必须共用：.config 决定「make download 要下哪些源码包」。
          # 两处各写一份必然漂移，后果是「预热以为不用某包 → 镜像里永远
          # 没有 → 每次构建都回落到慢速第三方源」这种长期隐性失效
          # （本仓库的 chinadns-ng 注释与实现相反，就是同类漂移的实例）。
          TARGET="$TARGET" sh ../openwrt-build/tools/gen-openwrt-config.sh

      - name: Verify SQM / i18n enabled and file services excluded
        working-directory: lede
        run: |
          # defconfig 会按依赖解析重算所有符号，可能把上面的排除项重新选上。
          # 这里显式复核，任一项不符即失败（不使用 || true）。
          echo "=== SQM / cake 相关（应全部为 =y）==="
          for sym in CONFIG_PACKAGE_sqm-scripts CONFIG_PACKAGE_kmod-sched-cake \
                     CONFIG_PACKAGE_kmod-ifb CONFIG_PACKAGE_kmod-sched-core \
                     CONFIG_PACKAGE_tc-tiny; do
            if grep -q "^${sym}=y$" .config; then
              echo "OK   ${sym}=y"
            else
              echo "FAIL ${sym} 未启用："
              grep -E "^#? ?${sym}[ =]" .config || echo "  (符号不存在于 .config)"
              exit 1
            fi
          done

          echo "=== luci-app-sqm（缺失只告警，不阻断）==="
          grep -q "^CONFIG_PACKAGE_luci-app-sqm=y$" .config \
            && echo "OK   CONFIG_PACKAGE_luci-app-sqm=y" \
            || echo "WARN luci-app-sqm 未启用（LuCI 里无 SQM 页面，但内核与脚本仍生效）"

          echo "=== luci-app-trafficctl 的功能依赖 ==="
          # 本仓库已在 Makefile 里去掉上游的 +hostapd-utils（理由见该文件注释：
          # 它只在选中 hostapd/wpad 变体时存在，x86_64 无 WiFi → 不可满足 →
          # 会导致 luci-app-trafficctl 与其 i18n 子包一起从 .config 消失）。
          # 故这里只断言真正存在且必需的两项。
          for sym in CONFIG_PACKAGE_iw CONFIG_PACKAGE_conntrack; do
            if grep -q "^${sym}=y$" .config; then
              echo "OK   ${sym}=y"
            else
              echo "FAIL ${sym} 未启用（trafficctl 相应功能会降级）："
              grep -E "^#? ?${sym}(=| is not set)" .config || echo "  (符号不存在于 .config)"
              exit 1
            fi
          done
          # 反向断言：Makefile 里不得再出现 hostapd-utils 依赖。
          # 它若被加回去，整包会被依赖求解丢弃（症状隐蔽：构建成功但界面变英文）。
          if grep -q 'hostapd-utils' ../openwrt-build/package/luci-app-trafficctl/Makefile \
               && grep -qE '^LUCI_DEPENDS:.*hostapd-utils' ../openwrt-build/package/luci-app-trafficctl/Makefile; then
            echo "FAIL Makefile 的 LUCI_DEPENDS 又含 hostapd-utils"
            echo "     该符号在 x86_64（无 WiFi）不可满足，会让整包与中文包一起消失。"
            grep -nE '^LUCI_DEPENDS:' ../openwrt-build/package/luci-app-trafficctl/Makefile
            exit 1
          else
            echo "OK   LUCI_DEPENDS 未含 hostapd-utils（x86_64 不可满足）"
          fi

          echo "=== trafficctl 本体与中文语言包都必须入配置 ==="
          # 正确符号：luci-i18n-trafficctl-zh-cn
          #   luci.mk 由目录名推导 LUCI_BASENAME=trafficctl，再生成
          #   Package/luci-i18n-$(LUCI_BASENAME)-$(lang)。
          # 历史错误写法 luci-i18n-luci-app-trafficctl-zh-cn 不匹配任何符号，
          # 会被 confdata.c 静默忽略，导致中文包从未编入。
          #
          # 这里同时断言**本体**：中文语言包是 luci-app-trafficctl 的子包
          # （DEPENDS:=$(PKG_NAME)），本体一旦被依赖求解丢弃，语言包必然
          # 跟着消失。只查语言包会在根因上绕远路（v0.4.7/v0.4.8 的经历）。
          tfail=0
          for sym in CONFIG_PACKAGE_luci-app-trafficctl \
                     CONFIG_PACKAGE_luci-i18n-trafficctl-zh-cn; do
            if grep -q "^${sym}=y$" .config; then
              echo "OK   ${sym}=y"
            else
              echo "FAIL ${sym} 未启用"
              tfail=1
            fi
          done
          if [ "$tfail" != "0" ]; then
            # 诊断输出：kconfig 对未启用的 bool 写的是
            #   # CONFIG_PACKAGE_x is not set
            # 行尾**没有** '='，所以 `grep '…trafficctl.*='` 永远匹配不到，
            # 会误报「无任何 trafficctl i18n 符号」。故这里直接列出全部相关行。
            echo "--- .config 中与 trafficctl 有关的全部符号 ---"
            grep -E "trafficctl" .config || echo "  (一条都没有 → 包被依赖求解整体丢弃)"
            echo "--- 根因排查：hostapd/wpad 变体是否存在 ---"
            grep -E "^#? ?CONFIG_PACKAGE_(hostapd|wpad|wpa-supplicant)[a-z0-9_-]*(=| is not set)" .config \
              || echo "  (没有任何 hostapd/wpad 变体 → x86_64 无 WiFi)"
            echo "  提示：若上面既无 luci-app-trafficctl 也无 luci-i18n-*，则根因是"
            echo "        LUCI_DEPENDS 里含本目标不可满足的包（历史上是 hostapd-utils）。"
            exit 1
          fi

          echo "=== dnschain 本体与中文语言包都必须入配置 ==="
          # v0.9.0 首次构建的教训：只写了 package/luci-app-dnschain 却没在 CI 里
          # 复制+启用 → 固件里一个页面文件都没有，而构建**全绿**。
          # 只查「文件在仓库里」不够，必须查「符号进了 .config」。
          # 符号推导同 trafficctl：LUCI_BASENAME=dnschain
          #   → luci-i18n-dnschain-zh-cn
          #
          # v0.10.0：不再要求 CONFIG_PACKAGE_chinadns-ng。
          # 框架已移除该组件（-t 不支持 DoH，而落地节点到 853 不通）。
          # SSR-Plus 自己仍带该二进制（INCLUDE_ChinaDNS_NG），但框架不依赖它，
          # 故不作为硬断言 —— 避免 SSR-Plus 关掉该 INCLUDE 时误报框架有问题。
          dfail=0
          for sym in CONFIG_PACKAGE_luci-app-dnschain \
                     CONFIG_PACKAGE_luci-i18n-dnschain-zh-cn; do
            if grep -q "^${sym}=y$" .config; then
              echo "OK   ${sym}=y"
            else
              echo "FAIL ${sym} 未启用"
              dfail=1
            fi
          done
          if [ "$dfail" != "0" ]; then
            echo "--- .config 中与 dnschain 有关的全部符号 ---"
            grep -E "dnschain" .config || echo "  (一条都没有 → 包被依赖求解整体丢弃)"
            echo "  提示：若 luci-app-dnschain 一条都没有，检查 package/ 是否已复制进"
            echo "        lede/package/（见 'Add luci-app-dnschain' 步骤）。"
            exit 1
          fi

          echo "=== 应被排除的文件服务（必须不为 =y）==="
          for sym in CONFIG_PACKAGE_vsftpd CONFIG_PACKAGE_ksmbd-server \
                     CONFIG_PACKAGE_autosamba; do
            if grep -q "^${sym}=y$" .config; then
              echo "FAIL ${sym} 仍被启用（依赖解析把它选回来了）"
              exit 1
            fi
            echo "OK   ${sym} 未启用"
          done

          echo "=== LuCI 主题：shadcn 必须启用 ==="
          # 判据分两类（v0.9.1 修正过一次，见下方说明）：
          #   (a) shadcn 必须 =y —— 缺它就没有新主题
          #   (b) 非默认主题应关闭 —— 但不能要求 bootstrap 关闭
          #
          # ⚠️ 为什么 bootstrap 允许保留：
          # lede 的 collections/luci/Makefile 硬依赖 +luci-theme-bootstrap，
          # 写 `is not set` 会在 make defconfig 时被依赖求解再次选回 =y。
          # 早先的断言要求 bootstrap 关闭 → 必然失败（run 39549176947）。
          # 保留它反而是好事：shadcn 若在真机上有兼容问题，把
          # luci.main.mediaurlbase 改回 /luci-static/bootstrap 即可回退，
          # 不需要重新编译固件。
          tfail2=0
          if grep -q '^CONFIG_PACKAGE_luci-theme-shadcn=y$' .config; then
            echo "OK   CONFIG_PACKAGE_luci-theme-shadcn=y"
          else
            echo "FAIL luci-theme-shadcn 未启用"
            tfail2=1
          fi
          # bootstrap 仅报告，不判失败
          if grep -q '^CONFIG_PACKAGE_luci-theme-bootstrap=y$' .config; then
            echo "OK   luci-theme-bootstrap=y（保留作回退路径，属预期）"
          fi
          # 其余主题应关闭
          for t in material openwrt openwrt-2020 argon design; do
            if grep -q "^CONFIG_PACKAGE_luci-theme-${t}=y$" .config; then
              echo "FAIL luci-theme-${t} 仍被启用（应已关闭）"
              tfail2=1
            fi
          done
          [ "$tfail2" = "0" ] && echo "OK   其他非默认主题均已关闭"
          if [ "$tfail2" != "0" ]; then
            echo "--- .config 中与 luci-theme 有关的全部符号 ---"
            grep -E 'luci-theme' .config || echo "  (一条都没有 → 主题包未被识别)"
            echo "  提示：检查 'Fetch luci-theme-shadcn' 步骤是否成功，
                     以及 package/luci-theme-shadcn/Makefile 是否存在。"
            exit 1
          fi

          echo "=== LuCI 主题：默认主题设为 shadcn 的脚本必须就位 ==="
          # 注意: 这里查的是**仓库**里的源文件（../openwrt-build/files/...），
          # 不是 lede/files/ —— 因为 'Apply gaming optimization files overlay'
          # 步骤在本步骤**之后**才复制 files/ 进 lede。用仓库路径可以提前发现问题。
          THEME_UCI=../openwrt-build/files/etc/uci-defaults/99-zzz-luci-theme-shadcn
          if [ -f "$THEME_UCI" ]; then
            echo "OK   $THEME_UCI 存在"
            if grep -q 'luci.main.mediaurlbase' "$THEME_UCI"; then
              echo "OK   含 mediaurlbase 设置"
            else
              echo "FAIL $THEME_UCI 未设置 mediaurlbase（主题装了也不会生效）"
              exit 1
            fi
            # 排序断言：必须晚于主题自带的 30_luci-theme-shadcn
            first=$(printf '%s\n%s\n' '30_luci-theme-shadcn' '99-zzz-luci-theme-shadcn' \
                    | LC_ALL=C sort | head -1)
            if [ "$first" = "30_luci-theme-shadcn" ]; then
              echo "OK   排序：99-zzz 晚于主题自带的 30_（可覆盖其判断）"
            else
              echo "FAIL 排序错误，99-zzz 未能晚于 30_"
              exit 1
            fi
          else
            echo "FAIL 缺少 $THEME_UCI（默认主题不会切换）"
            exit 1
          fi

      - name: Apply gaming optimization files overlay
        working-directory: lede
        run: |
          # 将 openwrt-build/files/ 中的配置文件覆盖到固件 rootfs
          # OpenWrt 构建系统会在打包时将 files/ 目录内容合并到根文件系统
          if [ -d ../openwrt-build/files ]; then
            cp -r ../openwrt-build/files ./
            echo "Gaming optimization files copied to lede/files/"
            find files/ -type f | sort
          else
            echo "No files/ directory found in openwrt-build"
            exit 1
          fi
          # 关键脚本必须可执行（init/hotplug/uci-defaults 均需执行位，
          # 否则固件内 /etc/init.d/dnsproxy 等无法运行 → LuCI 服务控制全部失效）
          # 注意: 不使用 || true —— 文件缺失/权限异常必须让 CI 明确失败；
          #       仅对实际存在的目录执行 chmod（避免 glob 无匹配报错）。
          chmod +x files/etc/init.d/dnsproxy
          chmod +x files/etc/rc.local
          chmod +x files/etc/uci-defaults/*
          if [ -d files/etc/hotplug.d/iface ]; then chmod +x files/etc/hotplug.d/iface/*; fi
          if [ -d files/etc/hotplug.d/dhcp ]; then chmod +x files/etc/hotplug.d/dhcp/*; fi
          # dnschain（DNS 链路框架，见 docs/adr/0003-dns-chain-framework.md）
          # 注意: 不使用 || true —— 缺失必须让 CI 明确失败（红线 3）。
          if [ -f files/etc/init.d/dnschain ]; then chmod +x files/etc/init.d/dnschain; fi
          if [ -f files/usr/bin/dnschain-reconcile ]; then chmod +x files/usr/bin/dnschain-reconcile; fi
          if [ -f files/usr/bin/dnschain-selftest ]; then chmod +x files/usr/bin/dnschain-selftest; fi
          if [ -f files/usr/share/dnschain/dnschain.sh ]; then chmod +x files/usr/share/dnschain/dnschain.sh; fi
          # v0.13.0：健康探测与自动改道。缺执行位时 rpcd 调不动，
          # 页面上「立即探测一轮」等按钮会静默无反应（不报错、无日志）。
          # v0.16.0：未知目标分诊。同样缺不得执行位 ——
          # 页面「立即分诊未知目标」按钮会静默失败。
          echo "files overlay 执行位设置完成:"
          ls -l files/etc/init.d/ files/etc/uci-defaults/ files/etc/hotplug.d/iface/ files/etc/rc.local 2>/dev/null

      - name: Verify mosdns template contract (upstreams at line 14, reject before forward)
        working-directory: lede
        run: |
          # files/etc/ssrplus/mosdns-config.yaml 是本仓库对 SSR-Plus 模板的 overlay。
          # 它必须满足 SSR-Plus init 脚本（/etc/init.d/shadowsocksr 第 1283 行）的契约：
          #   awk -v line=14 'NR == line+1 {print text} 1'
          # 即 `upstreams:` 必须正好在第 14 行，否则 DoH 上游会被插到错误位置
          # → mosdns 配置损坏 → 23614 个 gfw_list 域名解析全部失败。
          # 该契约无法被 YAML 语法检查发现，故在此显式断言。
          # 同时断言 reject 规则排在 forward 之前（v0.4.0 的优化意图）。
          T=files/etc/ssrplus/mosdns-config.yaml
          [ -f "$T" ] || { echo "FAIL 缺少 $T"; exit 1; }

          line14="$(sed -n '14p' "$T" | sed 's/[[:space:]]*$//')"
          if [ "$line14" != "        upstreams:" ]; then
            echo "FAIL 模板第 14 行不是 'upstreams:'，实际为: [$line14]"
            echo "     这会让 init 脚本的 awk 把上游插错位置，mosdns 将无法启动。"
            sed -n '10,18p' "$T"
            exit 1
          fi
          echo "OK   第 14 行 = upstreams:"

          reject_ln="$(grep -n 'exec: reject 0' "$T" | head -1 | cut -d: -f1)"
          forward_ln="$(grep -n 'exec: \$forward_google' "$T" | head -1 | cut -d: -f1)"
          if [ -z "$reject_ln" ] || [ -z "$forward_ln" ]; then
            echo "FAIL 模板缺少 reject 或 forward 规则 (reject=$reject_ln forward=$forward_ln)"
            exit 1
          fi
          if [ "$reject_ln" -ge "$forward_ln" ]; then
            echo "FAIL reject (行 $reject_ln) 未排在 forward (行 $forward_ln) 之前"
            exit 1
          fi
          echo "OK   reject 行 $reject_ln < forward 行 $forward_ln"

          grep -q 'DNS_MODE' "$T" || { echo "FAIL 模板缺少 DNS_MODE 占位符"; exit 1; }
          grep -q 'DNS_PORT' "$T" || { echo "FAIL 模板缺少 DNS_PORT 占位符"; exit 1; }
          echo "OK   DNS_MODE / DNS_PORT 占位符存在"
          echo "mosdns 模板契约校验通过。"

      - name: Verify dnschain framework contracts
        working-directory: lede
        run: |
          # ── dnschain（DNS 链路框架）契约校验 ────────────────────────────
          # 依据 docs/adr/0003-dns-chain-framework.md。
          # 这些约束**无法被 shell 语法检查发现**，且违反后症状隐蔽
          # （链路看似正常、实际拿到污染答案或缓存层矛盾），故在此显式断言。
          rc=0

          LIB=files/usr/share/dnschain/dnschain.sh
          INIT=files/etc/init.d/dnschain
          CONF=files/etc/config/dnschain

          for f in "$LIB" "$INIT" "$CONF" \
                   files/usr/bin/dnschain-reconcile \
                   files/usr/bin/dnschain-selftest \
                   files/etc/uci-defaults/99-zz-dnschain; do
            if [ -f "$f" ]; then
              echo "OK   存在 $f"
            else
              echo "FAIL 缺少 $f"
              rc=1
            fi
          done

          # ── 1. POSIX sh（dash）兼容 ─────────────────────────────────
          # CI 用 sh 调用，runner 的 /bin/sh 是 dash。
          # bash 专有语法（进程替换、[[ ]]、数组）在 dash 里是**解析期**错误，
          # 脚本一行未执行即 exit 2（本仓库曾因此连续失败三天，AGENTS §6 第 11 条）。
          for f in "$LIB" "$INIT" files/usr/bin/dnschain-reconcile \
                   files/usr/bin/dnschain-selftest \
                   files/etc/uci-defaults/99-zz-dnschain; do
            [ -f "$f" ] || continue
            if sh -n "$f" 2>/tmp/dnschain-shn.err; then
              echo "OK   dash 语法通过: $f"
            else
              echo "FAIL dash 语法错误: $f"
              cat /tmp/dnschain-shn.err
              rc=1
            fi
          done

          # ── 2. 禁止 bash 专有语法 ──────────────────────────────────
          # 先剥掉注释行再判断，否则「解释错误写法的注释」会让断言永久误报
          # （v0.4.7 的 nft 守卫踩过这个坑）。
          #
          # 注意: 只查真正不兼容的三种形态，不要误伤 $(( )) 算术展开 ——
          #   $(( )) 是 POSIX，(( )) 作为**命令**才是 bash 专有。
          #   早先的断言用了 `\(\([^)]*\)\)[[:space:]]*$`，把 `pct=$(( ... ))`
          #   也判成 bash 语法，属误报，已改为「行首就是 ((」才算。
          for f in "$LIB" "$INIT" files/usr/bin/dnschain-reconcile \
                   files/usr/bin/dnschain-selftest \
                   files/etc/uci-defaults/99-zz-dnschain; do
            [ -f "$f" ] || continue
            body="$(grep -v '^[[:space:]]*#' "$f")"

            # (a) 进程替换 <( ) 或 >( )
            if printf '%s\n' "$body" | grep -qE '<\(|>\('; then
              echo "FAIL $f 含进程替换 <(...) / >(...)（dash 解析期错误）"
              printf '%s\n' "$body" | grep -nE '<\(|>\(' | head -5
              rc=1
            fi

            # (b) [[ ]] 条件表达式
            #
            # ⚠️ 不能直接 grep '\[\[' —— 它会命中 POSIX 字符类 [[:space:]]，
            # 那是**完全合法**的 POSIX 语法。实测（v0.13.0）本仓库的
            # dnschain.sh 里有 `sed -e 's/^[[:space:]]*//'`，
            # 旧断言把它判成 bash 语法 → CI 永远红。
            # 判据改为「[[ 后面紧跟空白」，即真正的条件表达式形态。
            if printf '%s\n' "$body" | grep -qE '(^|[^[:alnum:]_])\[\[[[:space:]]'; then
              echo "FAIL $f 含 [[ ]]（dash 不支持）"
              printf '%s\n' "$body" | grep -nE '(^|[^[:alnum:]_])\[\[[[:space:]]' | head -5
              rc=1
            fi

            # (c) bash 数组赋值 name=( ... )
            if printf '%s\n' "$body" | grep -qE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=\('; then
              echo "FAIL $f 含 bash 数组赋值"
              rc=1
            fi

            # (d) (( )) 作为**命令**（行首或分号/&&/|| 之后紧跟 ((，
            #     且不是 $(( 的算术展开）
            if printf '%s\n' "$body" | grep -qE '(^|[;&|][[:space:]]*)\(\([^$]'; then
              echo "FAIL $f 含 bash 的 (( )) 命令"
              printf '%s\n' "$body" | grep -nE '(^|[;&|][[:space:]]*)\(\([^$]' | head -5
              rc=1
            fi
          done
          echo "OK   无 bash 专有语法"

          # ── 3. 缓存层唯一（ADR §10.5）─────────────────────────────
          # dnsproxy 与 chinadns-ng 都不得带 --cache；
          # 缓存只允许在 dnsmasq 一层，否则同一域名会有两份答案。
          if grep -v '^[[:space:]]*#' "$LIB" | grep -qE '^\s*echo\s+"--cache'; then
            echo "FAIL 库脚本里生成 --cache（违反「缓存只在 dnsmasq 一层」）"
            rc=1
          fi
          if grep -v '^[[:space:]]*#' "$LIB" | grep -q 'echo "\\-\\-fallback"'; then
            echo "FAIL 库脚本里生成 --fallback（会回落污染上游，ADR §10.2）"
            rc=1
          fi
          if grep -v '^[[:space:]]*#' "$LIB" | grep -q -- '--ipv6-disabled'; then
            echo "FAIL 出现 --ipv6-disabled（全局关 AAAA 会连国内一起砍，ADR §5.4）"
            rc=1
          fi
          echo "OK   无 --cache / --fallback / --ipv6-disabled"

          # ── 4. v0.10.0：不再有 chinadns-ng ─────────────────────────
          #
          # 旧断言要求「-N tag:gfw」存在，那是 chinadns-ng 的 AAAA 抑制参数。
          # v0.10.0 移除了 chinadns-ng（它的 -t 不支持 DoH，而落地节点到
          # 853 全部不通），改为双 dnsproxy 实例 + dnsmasq 分流。
          # 故这里反转成「不得再出现 filter 参数生成」。
          if grep -v '^[[:space:]]*#' "$LIB" | grep -q 'dc_gen_filter_args'; then
            echo "FAIL 库脚本仍定义 dc_gen_filter_args（chinadns-ng 已移除）"
            rc=1
          else
            echo "OK   无 dc_gen_filter_args（chinadns-ng 已移除）"
          fi

          # 必须有国外实例参数生成函数
          if grep -v '^[[:space:]]*#' "$LIB" | grep -q 'dc_gen_foreign_args'; then
            echo "OK   有 dc_gen_foreign_args（国外 dnsproxy 实例）"
          else
            echo "FAIL 缺少 dc_gen_foreign_args"
            rc=1
          fi

          # 分流必须由 dnsmasq 的 server= 承担，**不能**用 dnsproxy 的
          # [/域名/] 形式 —— 实测 17767 条会让 dnsproxy 资源耗尽
          # （verbose 日志 idx=3..17769，查询直接 connection timed out）。
          if grep -v '^[[:space:]]*#' "$LIB" | grep -q '\[/&/\]'; then
            echo "FAIL 仍生成 [/域名/] 形式（17767 条会耗尽 dnsproxy 资源）"
            rc=1
          else
            echo "OK   无 [/域名/] 形式（分流由 dnsmasq 承担）"
          fi

          # ── 5. 不得写入明文 114.114.114.114 ────────────────────────
          if grep -v '^[[:space:]]*#' "$LIB" | grep -q '114\.114\.114\.114'; then
            echo "FAIL 出现明文 114.114.114.114"
            rc=1
          else
            echo "OK   无明文 114.114.114.114"
          fi

          # ── 6. v0.10.0：**不再过滤 xn--** ──────────────────────────
          #
          # 旧断言要求过滤 xn--，理由是 dnsproxy 的 [/域名/] 形式不认 punycode。
          # 但 v0.10.0 改用 dnsmasq 的 server=/域名/ 形式，dnsmasq 原生支持
          # punycode，过滤反而让 58 条 IDNA 域名失去分流
          # （实测 apple.xn--czr694b 等全部解析失败）。
          if grep -v '^[[:space:]]*#' "$LIB" | grep -q "grep -vE 'xn--'"; then
            echo "FAIL 仍过滤 xn--（dnsmasq 支持 punycode，过滤会丢失 58 条域名）"
            rc=1
          else
            echo "OK   不过滤 xn--（分流由 dnsmasq 承担，支持 punycode）"
          fi

          # ── 7. nft 片段只能写裸 chain（AGENTS 红线 7）──────────────
          if grep -v '^[[:space:]]*#' "$INIT" | grep -qE '^\s*table\s'; then
            echo "FAIL init 脚本生成的 nft 片段含 table 声明（会形成嵌套 table → 断网）"
            rc=1
          else
            echo "OK   nft 片段无 table 声明"
          fi

          # ── 8. uci-defaults 排序（必须晚于 99-gaming-optimize）────
          # 本框架要覆盖 99-gaming-optimize 写入的 pdnsd_enable=4。
          # uci-defaults 按文件名（C 排序）执行，要求 '99-zz-dnschain'
          # 排在 '99-gaming-optimize' 之后 —— 用 sort 的实际结果判定，
          # 而不是依赖 shell 的字符串比较（后者语义易混淆）。
          order="$(printf '%s\n%s\n' '99-gaming-optimize' '99-zz-dnschain' | LC_ALL=C sort | head -1)"
          if [ "$order" = "99-gaming-optimize" ]; then
            echo "OK   uci-defaults 排序: 99-zz-dnschain 晚于 99-gaming-optimize"
          else
            echo "FAIL 99-zz-dnschain 排序错误（sort 首项为 $order），无法覆盖 pdnsd_enable=4"
            rc=1
          fi

          # ── 9. 配置文件必须含关键默认值 ────────────────────────────
          #
          # v0.10.0 变更：
          #   - 删除 profile 'primary'（单档案，不再有 coexist）
          #   - 删除 foreign 'suppress' → 改为 foreign 'keep'
          #     （ipv6_support=1 后国外 IPv6 走代理，无需抑制 AAAA）
          #   - 新增 foreign_port '5336'（国外 dnsproxy 实例）
          #   - 新增 require_ipv6 '1'（SSR-Plus 的 IPv6 流量代理）
          for kv in "entry_port '5353'" "foreign_port '5336'" \
                    "foreign 'keep'" "domestic 'keep'" \
                    "require_ipv6 '1'" "filter_https_rr '0'"; do
            if grep -q "$kv" "$CONF"; then
              echo "OK   配置含 $kv"
            else
              echo "FAIL 配置缺少 $kv"
              rc=1
            fi
          done

          # 国外上游必须是 DoH（不是 DoT）
          if grep -q "list server 'https://dns.google/dns-query'" "$CONF"; then
            echo "OK   国外上游为 DoH"
          else
            echo "FAIL 国外上游不是 DoH（DoT 到 853 在本环境不通）"
            rc=1
          fi
          if grep -q "list server 'tls://8.8.8.8'" "$CONF"; then
            echo "FAIL 国外上游仍是 DoT（tls://8.8.8.8），落地节点到 853 不通"
            rc=1
          else
            echo "OK   国外上游无 DoT"
          fi

          # ── 10. P3：dnsproxy 的 cache 与 fallback 必须关闭/删除 ──────
          # ADR-0003 §10.5：缓存只在 dnsmasq 一层。
          # files/etc/config/dnsproxy 在框架关闭时仍会被 init.d/dnsproxy 使用，
          # 故它也必须遵守同一条约束，否则「关掉框架」会切到一套不同的策略。
          DP=files/etc/config/dnsproxy
          if [ -f "$DP" ]; then
            # cache.enabled 必须为 0
            if awk '/^config dnsproxy .cache./{f=1} f&&/option enabled/{print; exit}' "$DP" | grep -q "'0'"; then
              echo "OK   dnsproxy cache.enabled=0"
            else
              echo "FAIL dnsproxy cache.enabled 不是 0（违反「缓存只在 dnsmasq 一层」）"
              rc=1
            fi
            # 不得有 fallback（注释行除外）
            if grep -v '^[[:space:]]*#' "$DP" | grep -qE "^[[:space:]]*list fallback"; then
              echo "FAIL dnsproxy 仍有 list fallback（会回落污染上游，ADR §10.2）"
              rc=1
            else
              echo "OK   dnsproxy 无 fallback"
            fi
            # ipv6_disabled 必须为 0
            if grep -qE "option ipv6_disabled '0'" "$DP"; then
              echo "OK   dnsproxy ipv6_disabled=0"
            else
              echo "FAIL dnsproxy ipv6_disabled 不是 0（全局关 AAAA 会连国内一起砍）"
              rc=1
            fi
          else
            echo "FAIL 缺少 $DP"
            rc=1
          fi

          # ── 11. P4：applechina.conf overlay 必须无明文 DNS ──────────
          # ADR-0003 §10.9 选项 A：173 条明文 114.114.114.114 改为 127.0.0.1#5353
          AP=files/etc/ssrplus/applechina.conf
          if [ -f "$AP" ]; then
            ap_data=$(grep -c '^server=' "$AP" 2>/dev/null || echo 0)
            ap_plain=$(grep '^server=' "$AP" 2>/dev/null | grep -c '114\.114\.114\.114' || true)
            ap_enc=$(grep '^server=' "$AP" 2>/dev/null | grep -c '127\.0\.0\.1#5353' || true)
            if [ "$ap_data" -ne 173 ]; then
              echo "FAIL applechina.conf 数据行数 $ap_data（应为 173，与上游一致）"
              rc=1
            fi
            if [ "$ap_plain" -ne 0 ]; then
              echo "FAIL applechina.conf 仍有 $ap_plain 条明文 114.114.114.114"
              rc=1
            fi
            if [ "$ap_enc" -ne 173 ]; then
              echo "FAIL applechina.conf 只有 $ap_enc 条指向 127.0.0.1#5353（应为 173）"
              rc=1
            fi
            [ "$ap_data" -eq 173 ] && [ "$ap_plain" -eq 0 ] && [ "$ap_enc" -eq 173 ] \
              && echo "OK   applechina.conf: 173 条全部指向加密入口"
          else
            echo "FAIL 缺少 $AP（Apple 域名会走明文 114）"
            rc=1
          fi

          # ── 12. P4：853 拒绝片段必须是裸 chain 且优先级 -151 ────────
          # 已在路由器实测：裸 chain 经 fw4 include 后 nft 显示 priority mangle - 1
          INIT_DOT=$(grep -c 'priority -151' "$INIT" 2>/dev/null || echo 0)
          if [ "$INIT_DOT" -ge 1 ]; then
            echo "OK   init 脚本生成 priority -151 的 853 拒绝链"
          else
            echo "FAIL init 脚本缺少 priority -151（853 拒绝会被 tproxy 抢先）"
            rc=1
          fi

          # ── 13. init.d/dnsproxy 必须有框架让位逻辑 ─────────────────
          # 否则两个 procd 实例都绑 :5353，后起的静默失败
          if grep -q 'dnschain_takes_over' files/etc/init.d/dnsproxy 2>/dev/null; then
            echo "OK   init.d/dnsproxy 有 dnschain 让位逻辑"
          else
            echo "FAIL init.d/dnsproxy 缺让位逻辑（会与 dnschain 抢 :5353）"
            rc=1
          fi

          # ── 14. 验证 ADR 文档存在 ──────────────────────────────────
          # 注意: 本步骤的 working-directory 是 lede，而 docs/ 在**仓库根**
          # （与 lede 同级）。故必须用 ../openwrt-build/ 前缀 ——
          # 直接用 docs/... 会指到 lede/docs/，那是 lede 源码自带的目录，
          # 里面没有我们的 ADR（v0.9.0 首次构建因此失败）。
          for doc in docs/adr/0003-dns-chain-framework.md docs/adr/0004-dns-chain-verification.md; do
            if [ -f "../openwrt-build/$doc" ]; then
              echo "OK   文档存在 $doc"
            else
              echo "FAIL 缺少 $doc（在 ../openwrt-build/ 下未找到）"
              rc=1
            fi
          done

          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "!!! dnschain 契约校验失败，构建中止（禁止静默失败，AGENTS 红线 3）"
            exit 1
          fi
          echo ""
          echo "dnschain 框架契约校验通过。"

      - name: Verify no nested-table nft fragments (fw4 include contract)
        working-directory: lede
        run: |
          # ── 硬约束：/etc/nftables.d/*.nft 里**不得出现 table 声明** ──────────
          #
          # 背景（v0.4.4 的真实故障，已造成国内域名大面积无法解析与联网）：
          #   firewall4 的 ruleset 模板 /usr/share/firewall4/templates/ruleset.uc
          #   第 15 行 `table inet fw4 {` 开表，第 104 行
          #     include "/etc/nftables.d/*.nft"
          #   —— include 在**该 table 内部**。因此该目录下的文件只能是**裸 chain**。
          #   若写入 `table inet xxx { ... }`，会被嵌进 `table inet fw4` 内部形成
          #   **嵌套 table**，nft 报 `syntax error, unexpected table`。
          #   而 fw4 的加载路径是
          #     print | nft -c -f $STDIN || die "The rendered ruleset contains errors"
          #   —— 校验失败则**整个 ruleset 不加载**，input/forward/dstnat/srcnat、
          #   DNS 拦截、透明代理全部规则消失 → 断网。
          #
          # 该错误无法被任何 YAML/shell 语法检查发现，故在此显式断言。
          fail=0
          # 1) 仓库内直接存放的该目录片段文件
          if [ -d files/etc/nftables.d ]; then
            for f in files/etc/nftables.d/*.nft; do
              [ -f "$f" ] || continue
              if grep -qE '^[[:space:]]*table[[:space:]]' "$f"; then
                echo "FAIL $f 含 table 声明 —— 它会被 include 进 table inet fw4 内部，"
                echo "     形成嵌套 table 导致 fw4 整个 ruleset 加载失败（v0.4.4 故障根因）。"
                grep -nE '^[[:space:]]*table[[:space:]]' "$f" | head -3
                fail=1
              fi
            done
          fi
          # 2) 生成该目录片段的脚本（如 uci-defaults / init 脚本）里的 table 声明。
          #    只检查确实提到 nftables.d 的文件，避免误报 fw4 自身的 table 用法。
          for f in $(grep -rl 'nftables\.d' files/ 2>/dev/null); do
            [ -f "$f" ] || continue
            case "$f" in *.md) continue ;; esac
            if grep -qE '^[[:space:]]*table[[:space:]]' "$f"; then
              echo "FAIL $f 提到 /etc/nftables.d 且含 table 声明；"
              echo "     写入该目录的片段会被 include 进 table inet fw4 内部 → 嵌套 table → 断网。"
              grep -nE '^[[:space:]]*table[[:space:]]' "$f" | head -3
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "!!! nftables 片段契约校验失败，构建中止。"
            exit 1
          fi
          echo "OK   /etc/nftables.d 片段均为裸 chain（无 table 声明）"
          echo "nftables 片段契约校验通过。"

      - name: Verify SSR-Plus uci-defaults ordering contract
        working-directory: lede
        run: |
          # files/etc/uci-defaults/99-gaming-optimize 会写 shadowsocksr.@global[0].*，
          # 但 uci-defaults 按**文件名排序**执行：'99-gaming-optimize' 先于
          # 'luci-ssr-plus'。而首次刷机时 /etc/config/shadowsocksr 由 opkg conffile
          # 提供、实测为 0 字节 —— 空配置上 `uci set shadowsocksr.@global[0].k=v`
          # 会以 `Entry not found` 失败（退出码 1），导致写入静默丢弃。
          # 本步骤断言该脚本含「空配置先铺底」的守卫，防止将来被改回。
          T=files/etc/uci-defaults/99-gaming-optimize
          [ -f "$T" ] || { echo "FAIL 缺少 $T"; exit 1; }

          # 1) 必须有「空文件 → 先 reset 铺底」的守卫（判据与 luci-ssr-plus 同源）
          if ! grep -q '\[ ! -s /etc/config/shadowsocksr \]' "$T"; then
            echo "FAIL 缺少「空配置先铺底」守卫。"
            echo "     uci-defaults 中本脚本先于 luci-ssr-plus 执行，首刷时"
            echo "     /etc/config/shadowsocksr 为 0 字节，直接 uci set @global[0] 会"
            echo "     以 'Entry not found' 静默失败，三项 SSR-Plus 设置全部丢失。"
            exit 1
          fi
          echo "OK   存在「空配置先铺底」守卫"

          # 2) 铺底必须调用 reset（模板来自 /usr/share/shadowsocksr/shadowsocksr.config）
          if ! grep -q '/etc/init.d/shadowsocksr reset' "$T"; then
            echo "FAIL 守卫存在但未调用 /etc/init.d/shadowsocksr reset（模板不会铺底）"
            exit 1
          fi
          echo "OK   铺底调用 /etc/init.d/shadowsocksr reset"

          # 3) 写 shadowsocksr.@global[0] 的每一**节**之前都应有段存在性守卫。
          #    计数规则：守卫行必须为 1 或 2 处，且存在写入；同一守卫可保护
          #    其后连续的多条写入（第 4.5 节即 1 个守卫保护 2 条写入），
          #    故不要求 guard_n >= set_n，而要求「每处守卫之后至少有一条写入」
          #    且写入均为带失败日志的形式（见步骤 4）。
          guard_n="$(grep -c 'uci -q get shadowsocksr.@global\[0\]' "$T")"
          set_n="$(grep -cE '^[[:space:]]*uci set shadowsocksr\.@global\[0\]' "$T")"
          echo "守卫数=$guard_n  写入数=$set_n"
          if [ "$guard_n" -lt 1 ]; then
            echo "FAIL 未找到段存在性守卫（空配置下写入会静默失败）"
            exit 1
          fi
          if [ "$set_n" -lt 1 ]; then
            echo "FAIL 未找到 @global[0] 写入（本脚本应设置 SSR-Plus 的 MOSDNS/AAAA 开关）"
            exit 1
          fi
          # 每一处守卫之后必须至少有一处写入，否则守卫是多余的或写入被移走
          last_guard="$(grep -n 'uci -q get shadowsocksr.@global\[0\]' "$T" | tail -1 | cut -d: -f1)"
          last_set="$(grep -nE '^[[:space:]]*uci set shadowsocksr\.@global\[0\]' "$T" | tail -1 | cut -d: -f1)"
          if [ "$last_set" -lt "$last_guard" ]; then
            echo "FAIL 最后一处守卫(行 $last_guard)之后没有写入(最后写入在行 $last_set)"
            exit 1
          fi
          echo "OK   守卫覆盖所有 @global[0] 写入"

          # 4) 禁止裸 uci set（无失败反馈）—— 红线 3：禁止静默失败。
          #    正则锚定行首非注释、且行尾非续行符 '\'（续行写法下一行才接日志）。
          #    注释行（以 # 开头）不计入 —— 第 4.5 节的说明文字里引用了该写法。
          if grep -nE '^[[:space:]]*uci set shadowsocksr\.@global\[0\]\.[^\\]*$' "$T" \
               | grep -vE ':[[:space:]]*#'; then
            echo "FAIL 存在未接失败日志的裸 uci set（应写成 'uci set ... || log ERROR ...'）"
            exit 1
          fi
          echo "OK   shadowsocksr.@global[0] 写入均带失败日志"

          # 5) MSS clamp 必须按后端分派（fw4 不加载 /etc/firewall.user）
          if ! grep -q '/etc/nftables.d/10-mss-clamp.nft' "$T"; then
            echo "FAIL 缺少 fw4(nftables) 后端的 MSS clamp 路径。"
            echo "     fw4 不加载 /etc/firewall.user，只写该文件等于死代码。"
            exit 1
          fi
          echo "OK   MSS clamp 含 fw4/nftables 分支"
          echo "SSR-Plus uci-defaults 顺序契约校验通过。"

      # ==================================================================
      # 缓存恢复（两段）：dl/ 源码包镜像 + 交叉工具链
      #
      # 两段都**允许失败**（缓存没有/坏了就回退到完整流程），
      # 但「失败」与「没有」必须分开处理：前者是 bug，后者是正常。
      # 故用退出码 10（没有缓存）与其它非 0（真的出错）区分。
      #
      # 顺序要求：必须在 .config 生成之后（指纹要读 .config）、
      #          必须在 make download 之前（先放缓存再补缺）。
      # ==================================================================
      - name: Compute cache fingerprint
        id: fp
        working-directory: lede
        run: |
          # 指纹 = 「工具链相关文件内容 + .config 里的编译器符号」的内容哈希。
          # 不用 git commit：lede 每天都有提交，用 commit 做键缓存几乎永不命中。
          # 详细理由见 tools/lede-fingerprint.sh 头注释。
          sh ../openwrt-build/tools/lede-fingerprint.sh . | tee "$RUNNER_TEMP/fp.txt"
          TFP=$(sed -n 's/^TOOLCHAIN_FP=//p' "$RUNNER_TEMP/fp.txt")
          HFP=$(sed -n 's/^HOST_FP=//p' "$RUNNER_TEMP/fp.txt")
          [ -n "$TFP" ] && [ -n "$HFP" ] || {
            echo "!!! 指纹为空，缓存策略无法工作" >&2
            exit 1
          }
          echo "toolchain_fp=$TFP" >> "$GITHUB_OUTPUT"
          echo "host_fp=$HFP" >> "$GITHUB_OUTPUT"
          echo ">>> toolchain 指纹: $TFP"
          echo ">>> host 指纹:      $HFP"

      - name: Normalize source mtimes (toolchain cache prerequisite)
        working-directory: lede
        run: |
          # 必须做，否则工具链缓存 100% 不会被复用 —— 而且是静默失效。
          #
          # 原因：lede 用 scripts/timestamp.pl 按 mtime 判断「要不要重编」，
          # 而全新 git clone 会把所有源码 mtime 写成"现在"，
          # 于是缓存里那份旧 stamp 永远被判为过期。
          # 同时 host-build.mk 的 stamp 名里含 find_md5（也用 mtime），
          # mtime 每次都不同 → stamp 文件名每次都不同 → 宿主工具也必然重编。
          # 详见 tools/normalize-mtime.sh 头注释。
          #
          # ⚠️ 预热工作流（cache-deps.yml）用的是同一份归一规则，
          #    两边必须一致，否则 find_md5 不同、缓存照样不命中。
          sh ../openwrt-build/tools/normalize-mtime.sh .

      - name: Restore dl mirror from cache Release
        id: restore-dl
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # dl/ 镜像存放在 Release 资产里（tag 见 env.CACHE_TAG），
          # 由 cache-deps.yml 定时刷新。理由见 tools/cache-release.sh 头注释：
          # actions/cache 有 10GB 配额且「一周未访问即淘汰」，装不下 GB 级 dl/。
          #
          # 退出码 10 = 缓存不存在（首次运行/被清理），属正常。
          set +e
          sh openwrt-build/tools/cache-release.sh restore "$CACHE_TAG" "$RUNNER_TEMP/dl-in" 'dl.*'
          rc=$?
          set -e
          case "$rc" in
          0)
            echo ">>> 命中 dl 镜像，解包作为增量基础"
            sh openwrt-build/tools/dir-mirror.sh unpack dl "$RUNNER_TEMP/dl-in" lede
            echo "hit=true" >> "$GITHUB_OUTPUT"
            ;;
          10)
            echo ">>> 没有 dl 镜像（首次运行），将从上游完整下载"
            echo "hit=false" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "!!! 恢复 dl 镜像失败（exit=$rc）—— 这是 bug，不是「没有缓存」" >&2
            exit 1
            ;;
          esac
          echo "dl/ 文件数: $(find lede/dl -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')"

      - name: Restore toolchain cache from cache Release
        id: restore-tc
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 只取**指纹一致**的工具链：同一套 toolchain 源码 + 同一套编译器配置。
          # 指纹不同就当没有缓存（继续完整编译，产出新缓存）。
          #
          # 解包后必须过 verify-toolchain-cache.sh 才敢信任：
          # 缓存不完整的症状是「编译到一半 undefined reference」或
          # 「静默回退成完整重编」，都很难从构建输出反推。详见该脚本头注释。
          set +e
          sh openwrt-build/tools/cache-release.sh restore "$CACHE_TAG" "$RUNNER_TEMP/tc-in" \
            "toolchain-${{ steps.fp.outputs.toolchain_fp }}.*" \
            "host-${{ steps.fp.outputs.host_fp }}.*"
          rc=$?
          set -e

          if [ "$rc" -eq 10 ]; then
            echo ">>> 指纹无匹配缓存，将完整编译工具链"
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "!!! 恢复工具链缓存失败（exit=$rc）—— 这是 bug，不是「没有缓存」" >&2
            exit 1
          fi

          sh openwrt-build/tools/dir-mirror.sh unpack "toolchain-${{ steps.fp.outputs.toolchain_fp }}" \
            "$RUNNER_TEMP/tc-in" lede
          sh openwrt-build/tools/dir-mirror.sh unpack "host-${{ steps.fp.outputs.host_fp }}" \
            "$RUNNER_TEMP/tc-in" lede

          set +e
          sh openwrt-build/tools/verify-toolchain-cache.sh lede
          vrc=$?
          set -e
          if [ "$vrc" -eq 0 ]; then
            # 再用 lede **自己的判据**复核一次。
            #
            # subdir.mk 的 stampfile 规则是：
            #   $(stamp): $(TMP_DIR)/.build ...
            #     @+$(SCRIPT_DIR)/timestamp.pl -n $(stamp) <路径> <依赖stamp> || \
            #       $(MAKE) ... compile
            # 而 timestamp.pl 的判据本质是「这些路径里最新的文件是不是就是
            # stamp 自己」（它取 mtime 最大的那个，比较名字）。
            # 对工具链：stamp = staging_dir/toolchain-*/stamp/.toolchain_compile，
            #           路径 = toolchain/ 与 .gcc_final_installed。
            #
            # 为什么还要这一步：verify-toolchain-cache.sh 只证明「缓存内容
            # 是完整的」，这里证明「lede 会真的跳过它」。两者不是一回事 ——
            # mtime 归一漏了某个目录时，前者全过、后者判重编，
            # 于是缓存命中却白拿不到时间（构建照绿但慢 40 分钟）。
            #
            # 这里直接比较 mtime 而不是调 timestamp.pl：
            # 逻辑等价，但不依赖 cwd 与相对路径，且能打印出到底是哪个文件
            # 比 stamp 新（timestamp.pl 只返回布尔值，排障时看不到原因）。
            STAMP=$(find lede/staging_dir -maxdepth 3 -name '.toolchain_compile' 2>/dev/null | head -1)
            if [ -n "$STAMP" ]; then
              STAMP_TS=$(stat -c %Y "$STAMP")
              NEWER=$(find lede/toolchain -type f -newermt "@$STAMP_TS" 2>/dev/null | head -3)
              if [ -z "$NEWER" ]; then
                echo ">>> 复核通过：toolchain/ 里没有比 stamp 更新的文件 → 会跳过工具链编译"
                echo "hit=true" >> "$GITHUB_OUTPUT"
              else
                echo ">>> ⚠️ toolchain/ 里有比 stamp 更新的文件 → lede 仍会重编工具链："
                printf '      %s\n' $NEWER
                echo "    多半是 mtime 归一漏了目录。构建继续（正确性不受影响），"
                echo "    但本轮不会节省时间；请检查 tools/normalize-mtime.sh 的排除列表。"
                echo "hit=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo ">>> 找不到 .toolchain_compile stamp，无法复核（按命中处理）"
              echo "hit=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # 缓存不可用：清掉解包出来的东西，回退到完整编译。
            # 这里**不清空 dl/**（那是另一份资产，且与工具链无关）。
            echo ">>> 工具链缓存校验未通过（rc=$vrc），回退到完整编译"
            echo "    旧缓存会在本轮编译成功后由 cache-deps 覆盖"
            rm -rf lede/staging_dir lede/build_dir/toolchain-* lede/build_dir/host lede/build_dir/hostpkg
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download package sources
        working-directory: lede
        timeout-minutes: 60
        env:
          # ── 为什么需要这两个环境变量 ───────────────────────────────
          #
          # 2026-10-21 实测：run 39495602665 在**这一步**卡了 5h54m 直到
          # job 的 6h 上限被取消。日志尾部是：
          #   48 23.2M  48 11.2M  0  0  556  0 12:09:24 5:52:10 6:17:14
          #                                        ↑ 556 B/s
          # 即 nasm-2.16.03.tar.gz 从 www.nasm.us 以 556 B/s 下载，
          # 11.2MB 花了 5h52m，预计还要 6h17m。
          #
          # lede 的 scripts/download.pl 对每个文件按 @mirrors 顺序逐个尝试
          # （`while (!-f ...) { my $mirror = shift @mirrors; ... }`），
          # 而 curl **没有单文件超时**，遇到慢源就无限等 —— 这是根因。
          #
          # 两个对策（都利用 download.pl 已有的扩展点，不改上游代码）：
          #
          # 1. DOWNLOAD_MIRROR：download.pl 第 53-54 行读它，
          #    且 localmirrors() 在 @mirrors 的**最前面**被调用（第 241 行），
          #    故这里列的镜像**优先级最高**，慢的 www.nasm.us 会被跳过。
          #    格式为分号分隔。
          #
          # 2. CURL_OPTIONS：download.pl 第 112 行把它透传给 curl。
          #    --max-time 300 让单个文件最多下 5 分钟，超时即放弃该源、
          #    自动换下一个镜像 —— 避免「一个慢源拖死整个 job」。
          #    --retry 3 --retry-delay 2 处理偶发网络抖动。
          #
          # 两个变量只影响本步骤，不污染后续编译。
          DOWNLOAD_MIRROR: >-
            https://sources.cdn.openwrt.org;
            https://sources.openwrt.org;
            https://mirrors.aliyun.com/gnu;
            https://mirrors.tencent.com/gnu;
            https://mirrors.ustc.edu.cn/gnu
          CURL_OPTIONS: "--max-time 300 --retry 3 --retry-delay 2"
        run: |
          # 先探测镜像可达性（只报告，不阻断 —— 某个镜像挂了不该让构建失败，
          # download.pl 会自己换下一个）。
          echo "=== 镜像可达性探测 ==="
          for m in $(printf '%s' "$DOWNLOAD_MIRROR" | tr ';' ' '); do
            [ -n "$m" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$m/nasm-2.16.03.tar.gz" || echo 000)
            echo "  $code  $m"
          done

          echo "=== make download（dl 缓存命中=${{ steps.restore-dl.outputs.hit }}）==="
          # 用脚本而不是直接 make download，两个理由：
          #   ① 缓存里若有旧版本 tarball，download.pl 会 **die** 而不是重下
          #      （见 scripts/download.pl 的 "Hash of the local file ... does
          #      not match" 分支）。长期缓存 dl/ 之后这是必然事件；
          #      脚本会精确删掉不匹配的文件并重试，且逐条打印。
          #   ② 外层硬超时 + 自愈重试都封装在脚本里，YAML 里不再重复。
          # 详见 tools/make-download.sh 头注释。
          sh ../openwrt-build/tools/make-download.sh . "$JOBS" 3000 3

          echo "=== 下载结果核对 ==="
          ls dl/*.tar.* 2>/dev/null | wc -l | xargs echo "  dl/ 下的压缩包数量:"
          # 关键包必须存在（nasm 就是上一轮卡住的那个）
          for f in dl/nasm-2.16.03.tar.gz dl/linux-*.tar.* dl/gcc-13*.tar.*; do
            [ -f "$f" ] && echo "  OK   $(basename "$f")" || echo "  MISS $(basename "$f")"
          done

          # 关于 mtime 的说明（读 scripts/timestamp.pl 源码确认，勿凭印象改）：
          #
          #   stampfile 规则调用的是
          #     timestamp.pl -n <stamp> <路径> <依赖stamp>
          #   timestamp.pl 对 `-n` 的处理是 **peek 而不 shift**：
          #       elsif ($path =~ /^-n/) { my $arg = $ARGV[0]; $options{$path}=$arg; }
          #   所以 <stamp> 自己**也在后续的路径列表里**被 stat 一次。
          #   最终判据是「这批路径里 mtime 最大的那个是不是 <stamp> 自己」。
          #
          #   由此可得两条结论：
          #     ① 判定只在 <stamp>、源码目录、依赖 stamp 三者间比较；
          #        `tmp/.build` 虽然出现在 make 规则的依赖里（会让配方重跑，
          #        代价极小），但**不参与**这个比较。
          #        所以 make download 去 touch tmp/.build 不会导致工具链重编。
          #     ② 真正决定复用的是「stamp 是否比源码新」，而源码 mtime 来自
          #        全新 git clone（= 现在）。故必须在解包缓存**之前**做
          #        mtime 归一 —— 那一步已经在前面做过了。
          #   这里不需要再归一一次。
          if [ "${{ steps.restore-tc.outputs.hit }}" = "true" ]; then
            echo "=== 工具链缓存校验通过：本步骤只补下载 dl/ 里缺的包 ==="
          else
            echo "=== 工具链缓存未命中：本轮将完整编译工具链 ==="
          fi

      - name: Prebuild gn host tool with gcc-13 (fix gcc-12 ranges compile error)
        working-directory: lede
        run: |
          # ---------------------------------------------------------------
          # 背景: helloworld feed 的 gn(2026-08-13, Chromium build tool) 是
          #       naiveproxy(SSR-Plus INCLUDE_NaiveProxy=y) 的 host 构建依赖
          #       (naiveproxy/Makefile: PKG_BUILD_DEPENDS:=gn/host)。
          #       gn 新版在 ubuntu-22.04 默认 gcc-12 上编译失败:
          #         src/gn/scope.h:241 values_ | std::views::transform(...)
          #         (libstdc++-12 ranges 适配不完整, gcc-13 已修复)
          # 方案: 安装 gcc-13, 用 CC=gcc-13 CXX=g++-13 预编译 gn 并落 .built
          #       stamp(OpenWrt stamp 机制), make world 时自动跳过 gn。
          # 约束: 不改 helloworld 上游代码、不关闭 SSR-Plus 任何组件、
          #       不影响 luci-app-dnsproxy 的 patch 流程。
          # ---------------------------------------------------------------
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-13 g++-13
          # gn 的 Host/Compile 使用 $(NINJA)，先确保 ninja host 工具就绪（幂等）
          make tools/ninja/compile V=s
          # gen.py 读取 CC/CXX 环境变量写入 build.ninja（gn 官方构建惯例），
          # 预编译成功即生成 hostpkg/gn-*/.built stamp
          CC=gcc-13 CXX=g++-13 make package/feeds/helloworld/gn/host/compile V=s
          ls -l staging_dir/hostpkg/bin/gn
          echo "gn host 工具(gcc-13) 预编译成功"

      - name: Compile firmware
        working-directory: lede
        run: |
          # Gaming optimized build
          # files/ will be merged into rootfs during image generation
          make -j${{ env.JOBS }} V=s

      # ------------------------------------------------------------------
      # 产物重命名：给固件文件名加上版本号，便于区分不同构建。
      # 原始名（OpenWrt 生成）:
      #   openwrt-x86-64-generic-ext4-combined-efi.img.gz
      # 重命名为:
      #   openwrt-x86-64-ssrplus-<VERSION>-<SHORT_SHA>-ext4-combined-efi.img.gz
      # 即把 openwrt-x86-64 之后的 "generic" 替换为 "ssrplus-vX.Y.Z-<sha>"，
      # 保留后缀（ext4-combined-efi / squashfs-combined 等），
      # 这样刷机工具与用户仍能从文件名辨认镜像类型。
      # 同时生成 .sha256 校验文件。
      # ------------------------------------------------------------------
      - name: Rename firmware with version
        working-directory: lede
        run: |
          set -e
          TAG="ssrplus-${VERSION}-${SHORT_SHA}"
          echo ">>> 版本标签: $TAG"
          ls -l bin/targets/x86/64/*.img.gz

          found=0
          for f in bin/targets/x86/64/*.img.gz; do
            [ -e "$f" ] || { echo "!!! 未找到任何 .img.gz 产物" >&2; exit 1; }
            base="$(basename "$f")"
            # openwrt-x86-64-generic-ext4-combined-efi.img.gz
            #   -> 前缀 openwrt-x86-64-
            #   -> 其余 generic-ext4-combined-efi.img.gz
            rest="${base#openwrt-x86-64-}"
            # 把开头的目标名（generic）换成版本标签，保留镜像类型后缀
            suffix="${rest#*-}"                     # ext4-combined-efi.img.gz
            case "$rest" in
              *-*) : ;;                             # 含 '-'，可安全切分
              *) echo "!!! 产物名不符合预期（缺目标名与类型分隔）: $base" >&2; exit 1 ;;
            esac
            new="openwrt-x86-64-${TAG}-${suffix}"
            mv "$f" "bin/targets/x86/64/$new"
            echo ">>> $base"
            echo "    -> $new"
            (cd bin/targets/x86/64 && sha256sum "$new" > "$new.sha256")
            cat "bin/targets/x86/64/$new.sha256"
            found=$((found+1))
          done
          [ "$found" -ge 1 ] || { echo "!!! 未重命名任何产物" >&2; exit 1; }
          echo ">>> 共重命名 $found 个产物"
          ls -l bin/targets/x86/64/

          # 断言：重命名结果必须真的带版本号，且仍以 .img.gz 结尾
          # （防止将来改坏命名逻辑却默默出包）
          for f in bin/targets/x86/64/*.img.gz; do
            b="$(basename "$f")"
            case "$b" in
              *"${VERSION}"*) : ;;
              *) echo "!!! 产物名不含版本号 ${VERSION}: $b" >&2; exit 1 ;;
            esac
            case "$b" in
              *.img.gz) : ;;
              *) echo "!!! 产物名未以 .img.gz 结尾: $b" >&2; exit 1 ;;
            esac
          done
          echo ">>> 产物命名校验通过（均含版本号 ${VERSION} 且以 .img.gz 结尾）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # artifact 名带版本号，便于在 Actions 页区分每次构建
          name: openwrt-x86-64-ssrplus-${{ env.VERSION }}-${{ env.SHORT_SHA }}
          # 【必须 error，不能留默认的 warn】
          # 默认值 warn 的语义是「没匹配到文件也照样成功」——于是会出现
          # 「构建显示成功、Actions 上却没有任何产物」这种最难发现的静默失效
          # （用户侧的描述正是「完成编译但是没有产物」）。固件是本流水线唯一的
          # 交付物，没有它就该红。
          if-no-files-found: error
          path: |
            lede/bin/targets/x86/64/*.img.gz
            lede/bin/targets/x86/64/*.img.gz.sha256

      # ------------------------------------------------------------------
      # 产物兜底断言：直接查 Actions API 确认本次 run 真的有 artifact。
      #
      # 为什么在 upload-artifact 之后还要再查一次：
      #   `if-no-files-found: error` 只保证「有文件被匹配到」，不保证上传后
      #   产物可下载；而「构建绿了但产物没有」是本仓库反复踩过的形态
      #   （v0.4.5~v0.4.11 的空 Release 也是同一类静默失效）。
      #   这里以 API 的实际计数为准，不看步骤退出码。
      # ------------------------------------------------------------------
      - name: Assert firmware artifact exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          # 有界重试：artifact 刚上传完时，Actions API 可能还读不到（最终一致）。
          # 最多等 30s；超时才算失败。固定 sleep 会既拖慢成功路径、
          # 又在 API 慢时误判成「没有产物」。
          n=0
          for i in $(seq 1 6); do
            n="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.total_count')"
            [ "${n:-0}" -ge 1 ] && break
            echo "第 $i 次查询未见 artifact，等待 5s 后重试…"
            sleep 5
          done

          echo ">>> 本次 run 的 artifact 数：$n"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | "    \(.name)  \(.size_in_bytes) bytes  expired=\(.expired)"'

          if [ "${n:-0}" -lt 1 ]; then
            echo "!!! 编译完成但本次 run 没有任何 artifact —— 产物未上传成功" >&2
            echo "    （检查上一步 Upload artifacts 的日志；本断言就是为了让这种" >&2
            echo "      「构建绿、产物空」的情况显式失败，而不是静默通过）" >&2
            exit 1
          fi
          echo ">>> 产物断言通过"

      # ------------------------------------------------------------------
      # 把本轮补齐后的 dl/ 回写成缓存镜像。
      #
      # 为什么构建流程也要写缓存（不只是 cache-deps 定时任务）：
      #   lede master 随时会 bump 某个包的版本（新的 PKG_SOURCE/文件名）。
      #   定时预热是每天一次；若只在预热时更新镜像，那么「预热之后、
      #   构建之前」上游发生的版本变更就永远补不进镜像 —— 表现为每次构建
      #   都在 dl 里缺同一个包、每次都要回落到慢速源。构建成功时顺手回写，
      #   镜像就能与真实构建保持同步。
      #
      # 放在编译**之后**、且只在成功时执行（默认 if 就是 success()），
      # 失败构建不去污染缓存。上传失败也不影响固件交付 —— 故这一步
      # 明确 `continue-on-error: true`：缓存是加速手段，不是交付物，
      # 它坏了不该让一次成功的固件构建变红。
      # ------------------------------------------------------------------
      - name: Refresh dl mirror cache (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          N=$(sh openwrt-build/tools/dir-mirror.sh count lede/dl)
          echo ">>> 本轮 dl/ 文件数: $N"
          if [ "$N" -lt 50 ]; then
            echo "!!! dl/ 只有 $N 个文件，拒绝用它覆盖缓存镜像" >&2
            exit 1
          fi
          sh openwrt-build/tools/dir-mirror.sh pack dl lede "$RUNNER_TEMP/dl-out" 1900M dl
          sh openwrt-build/tools/cache-release.sh save "$CACHE_TAG" "$RUNNER_TEMP/dl-out"
          echo ">>> dl 缓存镜像已刷新"

      # ------------------------------------------------------------------
      # 发版（tag v* push）时：把编译产物上传到 GitHub Release。
      # release.yml 会先为该 tag 创建 Release（notes 取自 CHANGELOG 对应版本），
      # 本步在此上传固件文件；master push 场景跳过（只留 artifact）。
      # ------------------------------------------------------------------
      - name: Upload firmware to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          # 【必须】显式指定仓库。
          #
          # 为什么：本步的 working-directory 是**工作区根**，而本工作流用
          # `with.path: openwrt-build` / `with.path: lede` 把两份代码签出到了
          # **子目录**，根目录下**没有 .git**。`gh` 找不到本地仓库就无法确定
          # 目标仓库，会报：
          #   failed to run git: fatal: not a git repository ...
          # 结果 `gh release view` 永远失败 → 等待循环空转 60s → `gh release
          # create` 也失败 → 本步 exit 1 → **Release 建出来了却一个固件都没有**。
          # 这是长期存在的问题：v0.4.5 ~ v0.4.10 六个 Release 的 assets 均为 0。
          #
          # 另一个可用写法是给每条 gh 命令加 `--repo`；用 GH_REPO 更省事且
          # 不易漏（官方文档明确支持该环境变量）。
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          VER="${GITHUB_REF_NAME}"
          echo ">>> 将固件产物上传到 Release $VER（仓库 $GH_REPO）"

          # 等待 release.yml 已创建 Release（通常秒级完成；此处最多等 60s）
          #
          # 注意：这里必须区分「Release 确实还不存在」与「gh 命令本身出错」。
          # 早先的写法是 `if gh release view ... >/dev/null 2>&1; then break; fi`，
          # 它把**任何**失败都当成「还没就绪」，于是 GH_REPO 缺失这种硬错误
          # 被静默吞掉、白等 60 秒，最后只抛出一句含义不明的
          # 「Release 不存在（release.yml 未运行？）」，排查时极易被误导。
          ready=0
          for i in $(seq 1 12); do
            out="$(gh release view "$VER" 2>&1)" && { ready=1; break; }
            # gh 对不存在的 tag 输出的是 `release not found`（小写）。
            # 统一转小写再匹配，避免大小写差异导致判定失效
            # （bash 的 case 区分大小写，而 PowerShell 的 -like 不区分 ——
            #   校准时若用 PowerShell 观察会看不出这个坑）。
            lc="$(printf '%s' "$out" | tr 'A-Z' 'a-z')"
            case "$lc" in
              *"release not found"*|*"not found"*|*"http 404"*|*"could not find"*)
                echo "Release $VER 尚未就绪，等待 5s... ($i/12)" ;;
              *)
                # 非「未找到」的失败一律视为硬错误，立刻抛出真实原因
                echo "!!! gh release view 失败（不是「尚未创建」）：" >&2
                printf '%s\n' "$out" >&2
                exit 1 ;;
            esac
            sleep 5
          done

          if [ "$ready" != "1" ]; then
            echo "!!! Release $VER 在 60s 内仍未创建（release.yml 未运行？），改用 gh release create 兜底" >&2
            gh release create "$VER" --title "$VER" \
              --notes "自动生成的 Release（CHANGELOG 日志见 release.yml 工作流）"
          fi

          # 上传固件（幂等：文件已存在则跳过）
          # 产物已在 “Rename firmware with version” 步骤改名为带版本号形式，
          # 故这里同时上传 .img.gz 与 .sha256 校验文件。
          ls -l lede/bin/targets/x86/64/*.img.gz
          assets="$(gh release view "$VER" --json assets --jq '.assets[].name')"
          uploaded=0
          for f in lede/bin/targets/x86/64/*.img.gz lede/bin/targets/x86/64/*.img.gz.sha256; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            if printf '%s\n' "$assets" | grep -qx "$name"; then
              echo "已存在: $name，跳过"
            else
              gh release upload "$VER" "$f" --clobber
              echo "已上传: $name"
              uploaded=$((uploaded+1))
            fi
          done

          # 兜底断言：Release 上至少要有一个 .img.gz。
          # 否则会出现「流水线显示成功、Release 却是空的」这种最难发现的静默失效
          # （本步历史上正是如此：六个版本全部空 Release，而构建本身全程显示成功）。
          final="$(gh release view "$VER" --json assets --jq '.assets[].name' | grep -c '\.img\.gz$' || true)"
          if [ "${final:-0}" -lt 1 ]; then
            echo "!!! Release $VER 上没有任何 .img.gz 产物，发版不完整" >&2
            gh release view "$VER" --json assets --jq '.assets[].name' >&2
            exit 1
          fi
          echo ">>> Release $VER 产物上传完成（本次新上传 $uploaded 个，现存 .img.gz $final 个）"
          gh release view "$VER" --json url --jq .url